name: Phone

# Every change to the app reaches the installed phone build on its own. A push
# that touches wallet/ sends an over-the-air update to the "preview" channel,
# which the APK checks when it opens. A new APK is only needed when something
# native changes; run this workflow by hand with "build" ticked for that.

on:
  push:
    branches: [main]
    paths: ['wallet/**']
  workflow_dispatch:
    inputs:
      build:
        description: 'Also build a new APK'
        type: boolean
        default: false

# The token the run is given can read the repository and nothing more.
permissions:
  contents: read

jobs:
  phone:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      # the packages go in before the Expo token is anywhere in the run, so no
      # install script can read it
      - run: npm ci --no-audit --no-fund
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 24.11.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Send the change to the installed app
        # No key goes into the phone build: a key in a published bundle is a
        # key anyone can read. Claude is behind Beetle where the repository
        # names a server of Beetle's own that keeps the key (the variable
        # ANTHROPIC_BASE_URL); without one, Beetle answers from the script.
        env:
          EXPO_PUBLIC_ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        run: eas update --branch preview --environment preview --message "$(git log -1 --pretty=%s)" --non-interactive
      - name: Build a new APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
