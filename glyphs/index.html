<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beetle Glyphs</title>
<meta name="description" content="A parametric icon library for the Beetle wallet: a core set of 1,854 icons and the app's own glyphs, re-derived from stroke, radius, gap, choke and goo, editable point by point, exported as SVG, sprite or icon font.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fff'/%3E%3Cg fill='none' stroke='%23000' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16.9 7.9a6.4 6.4 0 1 1-9.8 0'/%3E%3Ccircle cx='12' cy='12' r='2.7'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="src/styles/globals.css">
<script>
  /* set the theme before paint so there is no flash */
  try { const s = JSON.parse(localStorage.getItem('beetle-glyphs-v5') || '{}'); const t = s.theme || 'system'; const host = document.documentElement.dataset.theme; const dark = t === 'dark' || (t === 'system' && (host ? host === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)); if (dark) document.documentElement.classList.add('dark'); if (s.surface && s.surface !== 'auto') document.documentElement.dataset.surface = s.surface; } catch (e) {}
</script>
</head>
<body>
<noscript><p style="padding:24px">Beetle Glyphs needs JavaScript to draw the icons.</p></noscript>
<script src="vendor/clipper.js"></script>
<script src="vendor/opentype.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
