<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beetle Glass</title>
<meta name="description" content="Beetle Glass: lay glass tiles over a photo. Circles, squares, ovals or the Beetle mark, bent, frosted and lit, in the browser. Your image never leaves your device.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
/* ==========================================================================
   Brand
   The six variables first are the ones to change to re-skin the tool (see
   README). The rest are the Beetle brand's own steps around them, taken from
   wallet/src/design/tokens.ts: the warm ink, the neutral white page, one
   orange for what moves, and the very dark brown for dark mode.
   ========================================================================== */
:root {
  --brand-primary: #2b2721;   /* Beetle ink: the Export button and the strongest words */
  --brand-accent: #f04f22;    /* Beetle orange: the one loud colour, for what moves */
  --bg: #f1f0ed;              /* behind the picture */
  --surface: #fafaf9;         /* the bar and the panel */
  --text: #2b2721;
  --radius: 16px;

  --on-primary: #fafaf9;
  --surface-2: #f1f0ed;       /* fields, tracks and chips: a step down from the surface */
  --surface-3: #e6e4e0;
  --text-2: #77726b;
  --text-3: #a7a29b;
  --rule: #e5e3de;
  --rule-strong: #cdc9c2;
  --accent-text: #b8390f;     /* orange words, deep enough to read on the page */
  --lockup: #2b2721;
  --frost: rgba(250, 250, 249, 0.76);
  --checker: #e8e6e2;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --font: "Beetle Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-title: "Sentient", "Beetle Sans", Georgia, serif;
  --ease: 150ms cubic-bezier(0.2, 0.7, 0.2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand-primary: #fbefe3; --on-primary: #1a130d;
    --bg: #1a130d; --surface: #241a13; --surface-2: #2e231a; --surface-3: #3a2d22;
    --text: #efe3cb; --text-2: #b3a693; --text-3: #8a7a68;
    --rule: #3a2d22; --rule-strong: #5a4a3d; --accent-text: #ff9466;
    --lockup: #c9b9a6; --frost: rgba(36, 26, 19, 0.78); --checker: #2e231a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand-primary: #fbefe3; --on-primary: #1a130d;
  --bg: #1a130d; --surface: #241a13; --surface-2: #2e231a; --surface-3: #3a2d22;
  --text: #efe3cb; --text-2: #b3a693; --text-3: #8a7a68;
  --rule: #3a2d22; --rule-strong: #5a4a3d; --accent-text: #ff9466;
  --lockup: #c9b9a6; --frost: rgba(36, 26, 19, 0.78); --checker: #2e231a;
  color-scheme: dark;
}

/* Geist, bundled as Beetle Sans (the open-licence face, licence beside it);
   Sentient, for the page's title only, from Fontshare as the wallet loads it */
@font-face { font-family: "Beetle Sans"; font-weight: 400; font-display: swap; src: url(assets/fonts/BeetleSans-Regular.ttf) format("truetype"); }
@font-face { font-family: "Beetle Sans"; font-weight: 500; font-display: swap; src: url(assets/fonts/BeetleSans-Medium.ttf) format("truetype"); }
@font-face { font-family: "Beetle Sans"; font-weight: 600; font-display: swap; src: url(assets/fonts/BeetleSans-SemiBold.ttf) format("truetype"); }
@font-face { font-family: "Sentient"; font-weight: 500; font-display: swap; src: url(https://cdn.fontshare.com/wf/XVVLA67EPQTZD7YHR3MQPW2IQXXDTGPX/IHGNDJMSP2Y53DG23KZTPBH753PUEUB2/RNUZPHMIVMPXFHVACRGCAJ32E6WUEDVU.ttf) format("truetype"); }

/* ==========================================================================
   Layout
   ========================================================================== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 14px/20px var(--font);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
svg { display: block; flex-shrink: 0; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 2px; }

.app {
  display: grid; height: 100vh; height: 100dvh;
  grid-template-columns: minmax(0, 1fr) 320px;
  grid-template-rows: 56px minmax(0, 1fr);
}

/* the bar */
.topbar {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px;
  padding: 0 12px 0 20px; background: var(--surface); border-bottom: 1px solid var(--rule);
  min-width: 0;
}
.brand { display: flex; align-items: center; color: var(--lockup); text-decoration: none; border-radius: var(--radius-xs); }
.brand svg { height: 18px; width: auto; }
.divider { width: 1px; height: 20px; background: var(--rule-strong); }
.title { margin: 0; font: 500 20px/24px var(--font-title); letter-spacing: -0.01em; white-space: nowrap; }
.spacer { flex: 1; }
.actions { display: flex; align-items: center; gap: 4px; }

/* buttons: tone, never a shadow */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 0 14px; border: 0; border-radius: var(--radius-sm);
  background: var(--surface-2); color: var(--text); font-weight: 500; cursor: pointer;
  transition: background var(--ease), color var(--ease), opacity var(--ease);
  white-space: nowrap;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: scale(0.98); }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: var(--brand-primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--brand-primary); opacity: 0.88; }
.btn-ghost { background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn[disabled], .icon-btn[disabled] { opacity: 0.4; pointer-events: none; }
.icon-btn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; padding: 0;
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--text); cursor: pointer;
  transition: background var(--ease), color var(--ease), opacity var(--ease);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* the stage: the picture and the bar above it */
.stage { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; min-width: 0; }
.private { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.private svg { width: 16px; height: 16px; }
.meta { color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; display: grid; place-items: center; padding: 0 20px 20px; }
.viewport.fill { padding: 0; }
.frame {
  position: relative; border-radius: var(--radius); overflow: hidden;
  background: repeating-conic-gradient(var(--checker) 0 25%, transparent 0 50%) 0 0 / 16px 16px;
}
.viewport.fill .frame { border-radius: 0; }
.frame canvas { display: block; width: 100%; height: 100%; }
.frame.loading::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, var(--surface-2) 30%, var(--surface-3) 50%, var(--surface-2) 70%) 0 0 / 300% 100%;
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -150% 0; } }
.drop {
  position: absolute; inset: 12px; display: grid; place-items: center; z-index: 2;
  border: 2px dashed var(--brand-accent); border-radius: var(--radius);
  background: var(--frost); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font: 500 16px/24px var(--font); color: var(--text); pointer-events: none;
}
.notice {
  max-width: 420px; padding: 24px; text-align: center; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--rule);
}
.notice h2 { margin: 0 0 8px; font: 500 20px/24px var(--font-title); }
.notice p { margin: 0; color: var(--text-2); }

/* the panel */
.panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-left: 1px solid var(--rule); }
.grab { display: none; }
.panel-head { padding: 16px 16px 0; border-bottom: 1px solid var(--rule); }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.quick .btn { width: 100%; }
.seedline { display: flex; justify-content: space-between; align-items: center; margin: 8px 2px 0; color: var(--text-2); font-size: 13px; }
.seedline b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip {
  flex-shrink: 0; height: 32px; padding: 0 12px; border: 1px solid var(--rule); border-radius: 999px;
  background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background var(--ease), border-color var(--ease), color var(--ease);
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--brand-primary); border-color: var(--brand-primary); color: var(--on-primary); }
.tabs { display: flex; gap: 20px; margin-top: 12px; }
.tab {
  position: relative; height: 40px; padding: 0; border: 0; background: none; cursor: pointer;
  color: var(--text-2); font-weight: 500; transition: color var(--ease);
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--brand-accent); }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 24px; overscroll-behavior: contain; }

/* a control */
.ctl { position: relative; padding: 10px 0; }
.ctl-head { display: flex; align-items: center; gap: 6px; min-height: 24px; }
.ctl-head label, .ctl-head .lbl { flex: 1; font-weight: 500; cursor: default; }
.val { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.dice { width: 28px; height: 28px; border-radius: var(--radius-xs); color: var(--text-2); }
.dice svg { width: 18px; height: 18px; }
.dice:hover { color: var(--text); }
.ctl.na .ctl-head label, .ctl.na .val { color: var(--text-3); }
.tip {
  position: absolute; left: 0; bottom: calc(100% - 6px); z-index: 5; max-width: 260px;
  padding: 8px 10px; border-radius: var(--radius-xs); background: var(--brand-primary); color: var(--on-primary);
  font-size: 12px; line-height: 16px; opacity: 0; pointer-events: none; transform: translateY(4px);
  transition: opacity var(--ease), transform var(--ease);
}
.ctl-head label:hover ~ .tip, .ctl-head .lbl:hover ~ .tip,
.ctl:has(:focus-visible) .tip { opacity: 1; transform: none; transition-delay: 300ms; }
.ctl:has(:focus-visible) .tip { transition-delay: 0ms; }

/* sliders: the track fills with the orange, the knob is the page's white */
input[type="range"] {
  -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 28px; margin: 2px 0 0;
  background: transparent; cursor: pointer; --lo: 0%; --hi: 50%;
  /* the filled part runs from --lo to --hi: from the left, or from the middle on a slider that goes below zero */
  --track: linear-gradient(to right, var(--surface-3) 0 var(--lo), var(--brand-accent) var(--lo) var(--hi), var(--surface-3) var(--hi) 100%);
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--track); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--track); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--rule-strong); transition: transform var(--ease), border-color var(--ease);
}
input[type="range"]::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--rule-strong);
}
input[type="range"]:hover::-webkit-slider-thumb { border-color: var(--brand-accent); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.1); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
input[type="range"]:focus-visible::-moz-range-thumb { outline: 2px solid var(--brand-accent); outline-offset: 2px; }
input[type="range"]:disabled { opacity: 0.4; cursor: default; }

/* segmented choices: the chosen one is the page's white on the grey */
.seg { display: flex; padding: 3px; gap: 2px; border-radius: var(--radius-sm); background: var(--surface-2); margin-top: 6px; }
.seg-opt {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  min-height: 34px; padding: 4px 2px; border: 1px solid transparent; border-radius: 9px; background: transparent;
  color: var(--text-2); font-size: 12px; font-weight: 500; cursor: pointer;
  transition: background var(--ease), color var(--ease), border-color var(--ease);
}
.seg-opt svg { width: 20px; height: 20px; }
.seg-opt:hover { color: var(--text); }
.seg-opt[aria-checked="true"] { background: var(--surface); border-color: var(--rule); color: var(--text); }
.seg.small { margin: 0; }
.seg.small .seg-opt { min-height: 28px; padding: 0 10px; flex-direction: row; font-size: 13px; }

/* switches: orange when on */
.switch {
  position: relative; width: 40px; height: 24px; padding: 0; border: 0; border-radius: 999px;
  background: var(--surface-3); cursor: pointer; transition: background var(--ease); flex-shrink: 0;
}
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
  background: #fafaf9; transition: transform var(--ease);
}
.switch[aria-checked="true"] { background: var(--brand-accent); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* colours, numbers */
.swatch {
  width: 32px; height: 24px; padding: 0; border: 1px solid var(--rule-strong); border-radius: 6px;
  background: none; cursor: pointer;
}
.swatch::-webkit-color-swatch-wrapper { padding: 2px; }
.swatch::-webkit-color-swatch { border: 0; border-radius: 4px; }
.swatch::-moz-color-swatch { border: 0; border-radius: 4px; }
.num {
  width: 96px; height: 32px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--radius-xs);
  background: var(--surface-2); font-variant-numeric: tabular-nums; text-align: right;
}

/* the light's dial */
.dialrow { display: flex; align-items: center; gap: 16px; margin-top: 6px; }
.dial {
  position: relative; width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0; cursor: grab; touch-action: none;
  background: var(--surface-2); border: 1px solid var(--rule);
}
.dial::before { content: ""; position: absolute; inset: 27px; border-radius: 50%; background: var(--rule-strong); }
.dial-knob {
  position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
  background: var(--brand-accent); transform: rotate(var(--a, 0deg)) translateX(22px);
}
.dial:focus-visible { outline: 2px solid var(--brand-accent); outline-offset: 3px; }
.hint { margin: 0; color: var(--text-2); font-size: 13px; }

/* groups under Advanced */
details { border-bottom: 1px solid var(--rule); }
summary {
  display: flex; align-items: center; justify-content: space-between; padding: 14px 0; cursor: pointer;
  font-weight: 600; list-style: none; border-radius: var(--radius-xs);
}
summary::-webkit-details-marker { display: none; }
summary svg { width: 18px; height: 18px; color: var(--text-2); transition: transform var(--ease); }
details[open] summary svg { transform: rotate(180deg); }
details > div { padding-bottom: 12px; }
.row2 { display: flex; align-items: center; gap: 8px; }
.logo-row { display: flex; gap: 8px; margin-top: 10px; }
.logo-row .btn { flex: 1; height: 32px; font-size: 13px; padding: 0 10px; }
.share { display: grid; grid-template-columns: 1fr; gap: 8px; padding-top: 16px; }
.share .btn { justify-content: flex-start; }

/* the toast and the dialog */
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 20; max-width: min(480px, calc(100vw - 32px));
  padding: 12px 16px; border-radius: var(--radius-sm); background: var(--brand-primary); color: var(--on-primary);
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity var(--ease), transform var(--ease);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
dialog {
  width: min(440px, calc(100vw - 32px)); padding: 20px; border: 1px solid var(--rule); border-radius: var(--radius);
  background: var(--surface); color: var(--text);
}
dialog::backdrop { background: rgba(43, 39, 33, 0.32); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
dialog h2 { margin: 0 0 4px; font: 500 20px/24px var(--font-title); }
dialog p { margin: 0 0 12px; color: var(--text-2); }
dialog textarea {
  width: 100%; height: 160px; padding: 10px; border: 1px solid var(--rule); border-radius: var(--radius-xs);
  background: var(--surface-2); font: 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; resize: vertical;
}
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

/* ==========================================================================
   Phones: the picture on top, the controls in a sheet that drags up
   ========================================================================== */
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar { padding: 0 8px 0 16px; gap: 8px; }
  .brand svg { height: 15px; }
  .title { font-size: 18px; }
  .actions { gap: 0; }
  .hide-sm { display: none !important; }
  .btn-primary { padding: 0 12px; }
  .stage { padding-bottom: var(--peek, 200px); }
  .stage-bar { padding: 8px 16px; gap: 4px 8px; flex-wrap: wrap; }
  .private { order: 3; width: 100%; }
  .viewport { padding: 0 16px 12px; }
  .panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: var(--sheet, 200px);
    border-left: 0; border-top: 1px solid var(--rule); border-radius: 24px 24px 0 0;
    transition: height 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .panel.dragging { transition: none; }
  .grab { display: grid; place-items: center; height: 24px; flex-shrink: 0; touch-action: none; cursor: grab; }
  .grab button { width: 56px; height: 20px; padding: 0; border: 0; background: none; cursor: grab; display: grid; place-items: center; border-radius: 8px; }
  .grab button::before { content: ""; width: 36px; height: 5px; border-radius: 3px; background: var(--rule-strong); }
  .panel-head { padding-top: 4px; }
}
@media (max-width: 420px) {
  .divider { display: none; }
  #export { width: 40px; padding: 0; }
  #export span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="./" aria-label="Beetle Glass, start over">
      <!-- the Beetle lockup: the mark and the name, the brand's own vectors (wallet/src/design/Lockup.tsx) -->
      <svg viewBox="0 0 100.77 20.49" aria-hidden="true" fill="currentColor">

<script>
'use strict';

/* ==========================================================================
   1. Config and defaults
   ========================================================================== */

const CONFIG = {
  sampleImage: 'assets/sample.jpg', // the photo it opens with: replace the file to change it
  logo: 'assets/logo.svg',          // the default Logo tile: replace the file to change it
  maxPreviewPixels: 4e6,            // the preview never draws more device pixels than this
  exportChunk: 2048,                // the export is drawn in squares this big
  historyLimit: 100,
  logoResolution: 256,              // the logo's distance field, in texels a side
};

const SHAPES = [
  // Each tile shape is a distance function in the shader (tileShape), picked by
  // its id. To add one: write its function there, give it the next id, list it here.
  { key: 'circle', id: 0, label: 'Circle', icon: '<circle cx="12" cy="12" r="7.5"/>' },
  { key: 'square', id: 1, label: 'Square', icon: '<rect x="4.5" y="4.5" width="15" height="15" rx="3.5"/>' },
  { key: 'oval',   id: 2, label: 'Oval',   icon: '<ellipse cx="12" cy="12" rx="8.5" ry="5.5"/>' },
  { key: 'logo',   id: 3, label: 'Logo',   icon: 'mark' },
];
const LENSES = [
  { key: 'prism',   id: 0, label: 'Prism' },
  { key: 'lens',    id: 1, label: 'Lens' },
  { key: 'contour', id: 2, label: 'Contour' },
  { key: 'flat',    id: 3, label: 'Flat' },
];
const FILLS = [
  { key: 'photo',   id: 0, label: 'Photo' },
  { key: 'frosted', id: 1, label: 'Frosted' },
  { key: 'colour',  id: 2, label: 'Colour' },
  { key: 'clear',   id: 3, label: 'Clear' },
];

const pct = v => v + '%';
const deg = v => v + '°';
const signed = v => (v > 0 ? '+' : '') + v;
/* Cell shape runs -100..100: wide past 0, tall below it, up to 128 to 1 */
const cellStretch = v => Math.pow(2, v / 100 * 7);
const cellShapeText = v => {
  if (v === 0) return '1:1';
  const r = cellStretch(Math.abs(v));
  const n = r >= 10 ? Math.round(r) : Math.round(r * 10) / 10;
  return v > 0 ? n + ':1' : '1:' + n;
};

/* Every setting: its default, its range, how it reads, and the range
   Randomize picks from. Values are kept in the units the controls show and
   turned into the shader's own in shaderValues(). */
const PARAMS = {
  shape:          { def: 'circle', choices: SHAPES, rand: () => pickWeighted([['circle', 4], ['square', 2.5], ['oval', 2.5], ['logo', 1]]) },
  size:           { def: 50, min: 0, max: 100, label: 'Size', tip: 'How big each tile is. Smaller means more tiles.', rand: [30, 72] },
  randomness:     { def: 30, min: 0, max: 100, label: 'Randomness', format: pct, tip: 'Varies each tile’s size, position and bend.', rand: [5, 70] },
  distortion:     { def: 50, min: 0, max: 100, label: 'Distortion', format: pct, tip: 'How strongly the glass bends the photo.', rand: [25, 85] },
  blur:           { def: 20, min: 0, max: 100, label: 'Blur', format: pct, tip: 'How frosted the glass is.', rand: () => chance(0.3) ? 0 : rnd(5, 45) },
  gap:            { def: 15, min: 0, max: 100, label: 'Spacing', format: pct, tip: 'The space between tiles.', rand: [4, 35] },

  angle:          { def: 0, min: 0, max: 180, label: 'Grid angle', format: deg, tip: 'Turns the whole grid.', rand: () => pick([0, 0, 0, 0, 15, 30, 45, 90, 135]) },
  squareCells:    { def: true, label: 'Square cells', tip: 'Keep rows and columns the same size. Turn off to stretch the cells.' },
  cellAspect:     { def: 0, min: -100, max: 100, label: 'Cell shape', format: cellShapeText, tip: 'Width to height of each cell. Tall and narrow gives ribbed glass.' },
  brick:          { def: 0, min: 0, max: 100, label: 'Brick offset', format: pct, tip: 'Slides every other row along, like brickwork.', rand: () => pick([0, 0, 50]) },
  rotation:       { def: 0, min: 0, max: 360, label: 'Rotation', format: deg, tip: 'Turns every tile in its place.' },
  randomRotation: { def: false, label: 'Random rotation', tip: 'Turns each tile by its own random amount.', rand: () => chance(0.35) },
  ovalRatio:      { def: 60, min: 20, max: 100, label: 'Oval ratio', format: pct, tip: 'How tall an oval is against its width.', rand: [40, 85], only: 'oval' },
  roundness:      { def: 35, min: 0, max: 100, label: 'Corner roundness', format: pct, tip: 'How round a square’s corners are.', rand: [10, 75], only: 'square' },
  seed:           { def: 1, min: 0, max: 99999, label: 'Seed', tip: 'The number behind the random layout. The same seed gives the same look.' },
  margin:         { def: 0, min: 0, max: 25, label: 'Margin', format: pct, tip: 'Keeps tiles away from the edges of the image.' },

  lens:           { def: 'lens', choices: LENSES, rand: () => pick(LENSES).key },
  shift:          { def: 0, min: -100, max: 100, label: 'Shift', format: signed, tip: 'Slides the picture inside each tile along the grid.', rand: () => chance(0.4) ? 0 : rnd(-35, 35) },
  stretch:        { def: 0, min: 0, max: 100, label: 'Stretch', format: pct, tip: 'Pulls the picture along the grid near each tile’s edge.', rand: () => chance(0.6) ? 0 : rnd(5, 40) },
  softness:       { def: 15, min: 0, max: 100, label: 'Edge softness', format: pct, tip: 'How softly each tile’s edge meets what is behind it.', rand: [4, 40] },

  shadowColor:    { def: '#2b2721', label: 'Shadow colour' },
  shadows:        { def: 20, min: 0, max: 100, label: 'Shadows', format: pct, tip: 'Darkens the side of each tile turned away from the light.', rand: [10, 45] },
  highlightColor: { def: '#ffffff', label: 'Highlight colour' },
  highlights:     { def: 30, min: 0, max: 100, label: 'Highlights', format: pct, tip: 'A bright line and glint where the light catches each tile.', rand: [15, 65] },
  lightAngle:     { def: 135, min: 0, max: 359, label: 'Light direction', format: deg, tip: 'Where the light comes from.', rand: () => rnd(0, 359) },

  fill:           { def: 'photo', choices: FILLS },
  fillColor:      { def: '#fbefe3', label: 'Gap colour' },
  grain:          { def: 0, min: 0, max: 100, label: 'Grain', format: pct, tip: 'Adds film grain over everything.', rand: () => chance(0.6) ? 0 : rnd(5, 25) },
  chroma:         { def: 0, min: 0, max: 100, label: 'Chromatic aberration', format: pct, tip: 'Splits colour at the bends, like real glass.', rand: () => chance(0.65) ? 0 : rnd(5, 35) },
};
const DEFAULTS = Object.fromEntries(Object.entries(PARAMS).map(([k, p]) => [k, p.def]));
const SIMPLE_SLIDERS = ['size', 'randomness', 'distortion', 'blur', 'gap'];
/* what Randomize all changes; the gap fill, colours, margin and cell shape are left as they are */
const RANDOMIZED = ['shape', 'size', 'randomness', 'distortion', 'blur', 'gap', 'angle', 'brick', 'roundness', 'ovalRatio',
  'lens', 'shift', 'stretch', 'softness', 'shadows', 'highlights', 'lightAngle', 'grain', 'chroma', 'randomRotation'];


/* ==========================================================================
   2. Shader
   One pass. For each pixel: find the tile it falls in, measure how far it is
   from that tile's edge, lean the glass by that much, look through it at the
   photo (blurred, split by colour if asked), then shade and light it.
   All lengths are in units of the image's short side, so the export at full
   size looks exactly like the preview.
   ========================================================================== */

const VERTEX_SHADER = `#version 300 es
in vec2 a_pos;
uniform vec4 u_view;   // the part of the image being drawn: x, y, width, height in 0..1
out vec2 v_uv;         // where in the image this pixel is, y down
void main() {
  vec2 t = a_pos * 0.5 + 0.5;
  v_uv = u_view.xy + vec2(t.x, 1.0 - t.y) * u_view.zw;
  gl_Position = vec4(a_pos, 0.0, 1.0);
}`;

const FRAGMENT_SHADER = `#version 300 es
precision highp float;
precision highp int;

in vec2 v_uv;
out vec4 outColor;

uniform sampler2D u_image;    // the photo, alpha premultiplied, with mipmaps
uniform sampler2D u_logo;     // the logo's signed distance field
uniform float u_texMin;       // texels along the photo's short side
uniform vec2  u_aspect;       // the image's size over its short side
uniform float u_px;           // one output pixel, in short-side units
uniform vec2  u_outSize;      // the whole output, in pixels

uniform int   u_shape;        // 0 circle, 1 square, 2 oval, 3 logo
uniform vec2  u_cell;         // a cell's width and height
uniform float u_fill;         // how much of its cell a tile fills
uniform float u_gridAngle;
uniform float u_brick;
uniform float u_rotation;
uniform float u_rotRandom;
uniform float u_roundness;
uniform float u_ovalRatio;
uniform float u_random;
uniform uint  u_seed;
uniform float u_margin;
uniform float u_logoDepth;    // the logo's deepest point, in units of its box

uniform int   u_lens;         // 0 prism, 1 lens, 2 contour, 3 flat
uniform float u_distortion;
uniform float u_shift;
uniform float u_stretch;
uniform float u_softness;
uniform float u_blur;         // the frosting's radius

uniform vec3  u_shadowColor;
uniform float u_shadows;
uniform vec3  u_highlightColor;
uniform float u_highlights;
uniform vec2  u_light;        // towards the light, in the image's plane

uniform int   u_fillMode;     // what shows between tiles: 0 photo, 1 frosted, 2 colour, 3 clear
uniform vec3  u_fillColor;
uniform float u_grain;
uniform float u_chroma;

const float TAU = 6.2831853;
const float GOLDEN_ANGLE = 2.3999632;
const int TAPS = 16;

mat2 turn(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }

/* ---- randomness: an integer hash (Chris Wellons' lowbias32, public domain) */
uint scramble(uint x) {
  x ^= x >> 16; x *= 0x7feb352du;
  x ^= x >> 15; x *= 0x846ca68bu;
  x ^= x >> 16;
  return x;
}
float toUnit(uint x) { return float(x >> 8) * (1.0 / 16777216.0); }

/* six numbers in 0..1 that belong to one tile and the seed */
void tileDice(vec2 id, out vec4 a, out vec2 b) {
  uint h = scramble(uint(int(id.x) + 50000) ^ scramble(uint(int(id.y) + 50000) ^ scramble(u_seed + 0x9e3779b9u)));
  a.x = toUnit(h); h = scramble(h);
  a.y = toUnit(h); h = scramble(h);
  a.z = toUnit(h); h = scramble(h);
  a.w = toUnit(h); h = scramble(h);
  b.x = toUnit(h); h = scramble(h);
  b.y = toUnit(h);
}

/* ---- the tile shapes, as signed distances: negative inside, zero on the edge */
float sdCircle(vec2 p, float r) { return length(p) - r; }

float sdRoundedBox(vec2 p, vec2 b, float r) {
  vec2 q = abs(p) - b + r;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}

float sdOval(vec2 p, vec2 ab) {
  float k0 = length(p / ab);
  float k1 = length(p / (ab * ab));
  return k1 > 0.0 ? k0 * (k0 - 1.0) / k1 : -min(ab.x, ab.y);
}

float sdLogo(vec2 p, float s) {          // s: half the logo's box
  vec2 uv = p / (2.0 * s) + 0.5;
  vec2 outside = max(abs(uv - 0.5) - 0.5, 0.0);
  return (texture(u_logo, clamp(uv, 0.0, 1.0)).r + length(outside)) * 2.0 * s;
}

/* the tile's outline, and the depth of its deepest point, which the glass's
   profile is measured against */
float tileShape(vec2 p, vec2 hs, out float depth) {
  float m = min(hs.x, hs.y);
  if (u_shape == 1) { depth = m; return sdRoundedBox(p, hs, u_roundness * m); }
  if (u_shape == 2) { vec2 ab = vec2(hs.x, hs.y * u_ovalRatio); depth = min(ab.x, ab.y); return sdOval(p, ab); }
  if (u_shape == 3) { depth = u_logoDepth * 2.0 * m; return sdLogo(p, m); }
  depth = m;
  return sdCircle(p, m);
}

/* ---- finding the tile a point is in */
struct Tile { vec2 c; vec2 hs; float angle; float dist; float slide; float d; float depth; };

bool insideMargin(vec2 c) {
  if (u_margin <= 0.0) return true;
  vec2 p = 0.5 * u_aspect + turn(u_gridAngle) * c;
  return all(greaterThanEqual(p, vec2(u_margin))) && all(lessThanEqual(p, u_aspect - u_margin));
}

/* Tiles can be moved and grown past their own cell, so the point is checked
   against its cell and the eight around it, and the tile it is deepest in wins.
   One tile sits on the middle of the image, so the grid is even about it. */
Tile findTile(vec2 g) {
  Tile best = Tile(vec2(0.0), vec2(1.0), 0.0, 1.0, 0.0, 1e9, 1.0);
  vec2 q = g / u_cell + 0.5;
  float row0 = floor(q.y);
  for (int j = -1; j <= 1; j++) {
    float row = row0 + float(j);
    float offset = u_brick * mod(row, 2.0);
    float col0 = floor(q.x - offset);
    for (int i = -1; i <= 1; i++) {
      vec2 id = vec2(col0 + float(i), row);
      vec4 r; vec2 r2;
      tileDice(id, r, r2);
      vec2 c = (id + vec2(offset, 0.0)) * u_cell + (r.yz - 0.5) * u_random * 0.6 * u_cell;
      if (!insideMargin(c)) continue;
      vec2 hs = 0.5 * u_cell * u_fill * (1.0 - u_random * 0.55 * r.x);
      float angle = u_rotation + u_rotRandom * (r.w - 0.5) * TAU;
      float depth;
      float d = tileShape(turn(-angle) * (g - c), hs, depth);
      if (d < best.d) best = Tile(c, hs, angle, 1.0 + u_random * (r2.x - 0.5) * 1.2, u_random * (r2.y - 0.5) * 0.8, d, depth);
    }
  }
  return best;
}

/* ---- the glass's profile: how steeply it leans at a point. rim runs from 0
   at the tile's deepest point to 1 at its edge. */
float lean(float rim) {
  if (u_lens == 0) return 1.2 * smoothstep(0.0, 0.3, rim);              // Prism: one even slope out from the middle
  if (u_lens == 1) return 0.6 * rim / sqrt(max(1.0 - rim * rim, 0.04)); // Lens: a dome, steepest at the edge
  if (u_lens == 2) { float k = smoothstep(0.35, 1.0, rim); return 2.2 * k * k; } // Contour: a level top that rounds off
  return 1.8 * smoothstep(0.8, 1.0, rim);                               // Flat: a level plate with a thin bevel
}

/* ---- looking at the photo through frosted glass: a disc of taps on a golden-
   angle spiral, read from the mip level that matches their spacing */
vec4 look(vec2 uv, float radius, float lod0, float spin) {
  float r = radius * u_texMin;
  if (r < 0.75) return textureLod(u_image, uv, lod0);
  float lod = max(lod0, log2(r * 0.45));
  vec4 sum = vec4(0.0);
  for (int i = 0; i < TAPS; i++) {
    float f = (float(i) + 0.5) / float(TAPS);
    float a = float(i) * GOLDEN_ANGLE + spin;
    sum += textureLod(u_image, uv + vec2(cos(a), sin(a)) * sqrt(f) * radius / u_aspect, lod);
  }
  return sum / float(TAPS);
}

/* a different turn of the spiral for each pixel, so the frosting has no pattern */
float pixelNoise() {
  vec2 f = floor(v_uv * u_outSize);
  return fract(52.9829189 * fract(dot(f, vec2(0.06711056, 0.00583715))));
}

void main() {
  vec2 A = u_aspect;
  vec2 P = v_uv * A;
  vec2 g = turn(-u_gridAngle) * (P - 0.5 * A);   // the point in the grid's own frame
  float lod0 = log2(max(u_px * u_texMin, 1.0));
  float spin = pixelNoise() * TAU;

  /* what lies between the tiles */
  vec4 gap;
  if (u_fillMode == 0) gap = textureLod(u_image, v_uv, lod0);
  else if (u_fillMode == 1) gap = look(v_uv, max(u_blur * 1.6, 0.012), lod0, spin);
  else if (u_fillMode == 2) gap = vec4(u_fillColor, 1.0);
  else gap = vec4(0.0);

  Tile t = findTile(g);
  float soft = u_softness * 0.35 * t.depth;
  float cover = 1.0 - smoothstep(-soft - u_px, u_px, t.d);

  vec4 col = gap;
  if (cover > 0.0) {
    /* the edge's outward direction, read off the distance field */
    vec2 p = turn(-t.angle) * (g - t.c);
    float e = max(t.depth * 0.02, u_px * 0.5);
    float dz;
    vec2 grad = vec2(
      tileShape(p + vec2(e, 0.0), t.hs, dz) - tileShape(p - vec2(e, 0.0), t.hs, dz),
      tileShape(p + vec2(0.0, e), t.hs, dz) - tileShape(p - vec2(0.0, e), t.hs, dz));
    vec2 nGrid = turn(t.angle) * (dot(grad, grad) > 0.0 ? normalize(grad) : vec2(0.0));
    vec2 nImage = turn(u_gridAngle) * nGrid;

    float rim = 1.0 - clamp(-t.d / max(t.depth, 1e-5), 0.0, 1.0);
    float slope = lean(rim) * u_distortion * t.dist;

    /* where this point of glass looks: in along the edge, along the grid by the shift */
    vec2 local = g - t.c;
    if (u_lens == 3) local *= 1.0 - 0.45 * u_distortion * t.dist;
    local -= nGrid * slope * t.depth * 0.8;
    local.x += (u_shift + t.slide) * u_cell.x * 0.5;
    local.y *= 1.0 - 0.9 * u_stretch * smoothstep(0.1, 1.0, rim);
    vec2 at = (0.5 * A + turn(u_gridAngle) * (t.c + local)) / A;

    float radius = u_blur * (1.0 + 1.5 * rim * rim);
    vec4 glass;
    if (u_chroma > 0.0) {
      vec2 split = nImage * u_chroma * (0.15 + rim) * t.depth * 0.3 / A;
      vec4 mid = look(at, radius, lod0, spin);
      glass = vec4(look(at + split, radius, lod0, spin).r, mid.g, look(at - split, radius, lod0, spin).b, mid.a);
    } else {
      glass = look(at, radius, lod0, spin);
    }

    /* light: the glass leans toward the light or away from it */
    vec3 L = normalize(vec3(u_light, 0.85));
    vec3 N = normalize(vec3(nImage * slope * 0.7, 1.0));
    float away = L.z - dot(N, L);
    float shade = clamp(away * 2.2, 0.0, 1.0) + 0.35 * pow(rim, 5.0) * min(slope, 1.0);
    float lit = clamp(-away * 2.2, 0.0, 1.0);
    vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
    float glint = pow(max(dot(N, H), 0.0), 48.0) * smoothstep(0.05, 0.5, slope);
    float lineWidth = max(1.25 * u_px, 0.045 * t.depth);
    float stroke = (1.0 - smoothstep(0.0, lineWidth, -t.d)) * (0.35 + 0.65 * max(dot(nImage, normalize(u_light)), 0.0));

    float hi = u_highlights * clamp(stroke * 0.9 + glint * 0.8 + lit * 0.4, 0.0, 1.0);
    float sh = u_shadows * clamp(shade, 0.0, 1.0);
    glass.rgb = mix(glass.rgb, u_shadowColor * glass.a, sh * 0.85);
    glass.rgb = mix(glass.rgb, u_highlightColor, hi);
    glass.a = mix(glass.a, 1.0, hi);

    col = mix(gap, glass, cover);
  }

  /* grain, fixed to the image so it lands in the same place at any size */
  if (u_grain > 0.0) {
    vec2 cell = floor(P / max(u_px, 1.0 / 1400.0));
    float n = toUnit(scramble(uint(int(cell.x) + 70000) ^ scramble(uint(int(cell.y) + 70000))));
    col.rgb += (n - 0.5) * u_grain * 0.25 * col.a;
  }

  col = clamp(col, 0.0, 1.0);
  outColor = col.a > 0.0 ? vec4(col.rgb / col.a, col.a) : vec4(0.0);
}`;


/* ==========================================================================
   3. WebGL setup
   ========================================================================== */

const canvas = document.getElementById('canvas');
let gl = null;
let program = null;
let uniforms = {};
let photoTexture = null;
let logoTexture = null;
let maxTextureSize = 4096;
let photo = null;          // { img, width, height, texWidth, texHeight, name }
let logo = null;           // { field: Float32Array, size, depth, custom, name }

const INT_UNIFORMS = new Set(['u_shape', 'u_lens', 'u_fillMode', 'u_image', 'u_logo']);
const UINT_UNIFORMS = new Set(['u_seed']);
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function setupGL() {
  gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return false;
  const compile = (type, source) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error('Shader did not compile: ' + gl.getShaderInfoLog(s));
    return s;
  };
  program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERTEX_SHADER));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAGMENT_SHADER));
  gl.bindAttribLocation(program, 0, 'a_pos');
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Shader did not link: ' + gl.getProgramInfoLog(program));
  gl.useProgram(program);

  uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const name = gl.getActiveUniform(program, i).name;
    uniforms[name] = gl.getUniformLocation(program, name);
  }

  /* one triangle that covers the whole viewport */
  gl.bindVertexArray(gl.createVertexArray());
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  photoTexture = gl.createTexture();
  logoTexture = gl.createTexture();
  if (photo) uploadPhoto(photo.img);
  if (logo) uploadLogo();
  return true;
}

function setUniform(name, value) {
  const loc = uniforms[name];
  if (loc === undefined || loc === null) return;
  if (Array.isArray(value)) {
    if (value.length === 2) gl.uniform2fv(loc, value);
    else if (value.length === 3) gl.uniform3fv(loc, value);
    else gl.uniform4fv(loc, value);
  } else if (INT_UNIFORMS.has(name)) gl.uniform1i(loc, value);
  else if (UINT_UNIFORMS.has(name)) gl.uniform1ui(loc, value >>> 0);
  else gl.uniform1f(loc, value);
}

/* The photo goes up once, at its own size unless the device cannot hold it,
   premultiplied and with mipmaps so blur and small previews read it cleanly. */
function uploadPhoto(img) {
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  const side = Math.min(maxTextureSize, IS_IOS ? 4096 : 8192);
  const area = IS_IOS ? 16.7e6 : 33.5e6;
  const k = Math.min(1, side / Math.max(w, h), Math.sqrt(area / (w * h)));
  const tw = Math.max(1, Math.round(w * k));
  const th = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas');
  c.width = tw; c.height = th;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, tw, th);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, photoTexture);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  c.width = c.height = 0;
  return { width: w, height: h, texWidth: tw, texHeight: th };
}

function uploadLogo() {
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, logoTexture);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R16F, logo.size, logo.size, 0, gl.RED, gl.FLOAT, logo.field);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

/* the settings, in the shader's units */
function shaderValues(s) {
  /* Size sets a cell's short side; Cell shape only ever lengthens the other,
     so tall narrow cells can run the whole height of the image as ribs */
  const cell = 0.012 * Math.pow(25, s.size / 100);
  const stretch = s.squareCells ? 1 : cellStretch(s.cellAspect);
  const light = s.lightAngle * Math.PI / 180;
  const byKey = (list, key) => (list.find(x => x.key === key) || list[0]).id;
  return {
    u_shape: byKey(SHAPES, s.shape),
    u_cell: stretch >= 1 ? [cell * stretch, cell] : [cell, cell / stretch],
    u_fill: 1 - s.gap / 100 * 0.75,
    u_gridAngle: s.angle * Math.PI / 180,
    u_brick: s.brick / 100,
    u_rotation: s.rotation * Math.PI / 180,
    u_rotRandom: s.randomRotation ? 1 : 0,
    u_roundness: s.roundness / 100,
    u_ovalRatio: s.ovalRatio / 100,
    u_random: s.randomness / 100,
    u_seed: s.seed,
    u_margin: s.margin / 100,
    u_lens: byKey(LENSES, s.lens),
    u_distortion: s.distortion / 100,
    u_shift: s.shift / 100,
    u_stretch: s.stretch / 100,
    u_softness: s.softness / 100,
    u_blur: Math.pow(s.blur / 100, 2) * 0.03,
    u_shadowColor: hexToRgb(s.shadowColor),
    u_shadows: s.shadows / 100,
    u_highlightColor: hexToRgb(s.highlightColor),
    u_highlights: s.highlights / 100,
    u_light: [Math.cos(light), -Math.sin(light)],
    u_fillMode: byKey(FILLS, s.fill),
    u_fillColor: hexToRgb(s.fillColor),
    u_grain: s.grain / 100,
    u_chroma: s.chroma / 100,
  };
}

/* Draw the image, or the part of it `view` names, into whatever is bound. */
function drawImage({ framebuffer = null, width, height, view = [0, 0, 1, 1], outWidth, outHeight, settings = state }) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  gl.viewport(0, 0, width, height);
  gl.useProgram(program);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, photoTexture);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, logoTexture);
  const short = Math.min(photo.width, photo.height);
  const values = Object.assign(shaderValues(settings), {
    u_image: 0,
    u_logo: 1,
    u_view: view,
    u_aspect: [photo.width / short, photo.height / short],
    u_texMin: Math.min(photo.texWidth, photo.texHeight),
    u_px: 1 / Math.min(outWidth, outHeight),
    u_outSize: [outWidth, outHeight],
    u_logoDepth: logo ? logo.depth : 0.25,
  });
  for (const [name, value] of Object.entries(values)) setUniform(name, value);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let renderQueued = false;
let firstFrame = true;
function requestRender() {
  if (renderQueued || !gl || !photo || !logo) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderNow(); });
}
function renderNow() {
  if (!gl || !photo || !logo || gl.isContextLost()) return;
  drawImage({ width: canvas.width, height: canvas.height, outWidth: canvas.width, outHeight: canvas.height });
  if (firstFrame) { firstFrame = false; document.getElementById('frame').classList.remove('loading'); }
}

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('The graphics card was reset. Redrawing…'); });
canvas.addEventListener('webglcontextrestored', () => { setupGL(); requestRender(); });


/* ==========================================================================
   4. State, history and the share link
   ========================================================================== */

let state = { ...DEFAULTS };
const history = { stack: [], index: -1, lastKey: null, lastTime: 0 };

/* A value from anywhere (a slider, a pasted file, a link) made safe for its setting. */
function sanitize(key, value) {
  const p = PARAMS[key];
  if (!p) return undefined;
  const d = p.def;
  if (p.choices) return p.choices.some(c => c.key === value) ? value : undefined;
  if (typeof d === 'boolean') return value === true || value === 'true' || value === '1' || value === 1;
  if (typeof d === 'string') return /^#?[0-9a-f]{6}$/i.test(String(value)) ? '#' + String(value).replace('#', '').toLowerCase() : undefined;
  const n = Math.round(Number(value));
  return Number.isFinite(n) ? Math.min(p.max, Math.max(p.min, n)) : undefined;
}
function cleaned(partial) {
  const out = {};
  for (const [k, v] of Object.entries(partial || {})) {
    const s = sanitize(k, v);
    if (s !== undefined) out[k] = s;
  }
  return out;
}

/* Change settings and keep the change as one step of history. Steps on the
   same control a moment apart (arrow keys, say) fold into one. */
function update(partial, foldKey = null) {
  Object.assign(state, cleaned(partial));
  syncUI();
  requestRender();
  commit(foldKey);
}

function commit(foldKey = null) {
  const snapshot = JSON.stringify(state);
  if (history.stack[history.index] === snapshot) return;
  const now = performance.now();
  const fold = foldKey && foldKey === history.lastKey && now - history.lastTime < 800 && history.index > 0 && history.index === history.stack.length - 1;
  if (fold) {
    history.stack[history.index] = snapshot;
  } else {
    history.stack.length = history.index + 1;
    history.stack.push(snapshot);
    if (history.stack.length > CONFIG.historyLimit) history.stack.shift();
    history.index = history.stack.length - 1;
  }
  history.lastKey = foldKey;
  history.lastTime = now;
  afterChange();
}

function travel(step) {
  const to = history.index + step;
  if (to < 0 || to >= history.stack.length) return;
  history.index = to;
  history.lastKey = null;
  state = { ...DEFAULTS, ...JSON.parse(history.stack[to]) };
  syncUI();
  requestRender();
  afterChange();
}
const undo = () => travel(-1);
const redo = () => travel(1);

function afterChange() {
  document.getElementById('undo').disabled = history.index <= 0;
  document.getElementById('redo').disabled = history.index >= history.stack.length - 1;
  writeHash();
}

/* The link carries the settings that differ from the defaults, never the photo. */
function encodeSettings(s) {
  return Object.keys(PARAMS)
    .filter(k => s[k] !== DEFAULTS[k])
    .map(k => k + '=' + encodeURIComponent(typeof s[k] === 'boolean' ? (s[k] ? 1 : 0) : String(s[k]).replace('#', '')))
    .join('&');
}
function decodeSettings(hash) {
  const out = {};
  for (const part of hash.replace(/^#/, '').split('&')) {
    const [k, v] = part.split('=');
    if (k && v !== undefined && PARAMS[k]) out[k] = decodeURIComponent(v);
  }
  return cleaned(out);
}
let writingHash = false;
function writeHash() {
  const h = encodeSettings(state);
  const url = location.pathname + location.search + (h ? '#' + h : '');
  writingHash = true;
  try { window.history.replaceState(null, '', url); } catch { /* a sandboxed frame may refuse; the link button still works */ }
  writingHash = false;
}
window.addEventListener('hashchange', () => {
  if (writingHash) return;
  state = { ...DEFAULTS, ...decodeSettings(location.hash) };
  syncUI();
  requestRender();
  commit();
});

function settingsJSON() {
  return JSON.stringify({ app: 'Beetle Glass', version: 1, settings: state }, null, 2);
}
function readSettingsJSON(text) {
  let data;
  try { data = JSON.parse(text); } catch { return null; }
  const settings = data && typeof data === 'object' ? (data.settings || data) : null;
  if (!settings || typeof settings !== 'object') return null;
  const c = cleaned(settings);
  return Object.keys(c).length ? c : null;
}


/* ==========================================================================
   5. Randomization
   ========================================================================== */

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = list => list[Math.floor(Math.random() * list.length)];
const chance = p => Math.random() < p;
function pickWeighted(pairs) {
  let r = Math.random() * pairs.reduce((s, [, w]) => s + w, 0);
  for (const [v, w] of pairs) if ((r -= w) <= 0) return v;
  return pairs[0][0];
}
function newSeed() {
  let s;
  do { s = 1 + Math.floor(Math.random() * 9999); } while (s === state.seed);
  return s;
}

/* A random value for one setting, from the range it reads well in. */
function randomValue(key) {
  const r = PARAMS[key].rand;
  const v = typeof r === 'function' ? r() : rnd(r[0], r[1]);
  return typeof v === 'number' ? Math.round(v) : v;
}

/* A whole new look. The ranges are kept where the result reads well, and a
   few pairings that turn to mush are kept apart. */
function randomizeAll() {
  const next = { seed: newSeed() };
  for (const key of RANDOMIZED) next[key] = randomValue(key);
  if (next.size < 40) next.blur = Math.min(next.blur, 25);              // small tiles and heavy frost lose the picture
  if (next.lens === 'flat' && next.distortion < 40) next.shift = Math.round(rnd(20, 40)) * (chance(0.5) ? 1 : -1);
  if (next.shape === 'logo') { next.size = Math.max(next.size, 45); next.randomness = Math.min(next.randomness, 40); }
  if (next.shape === 'circle' || next.shape === 'square') next.randomRotation = false;  // only shapes with a direction show a turn
  update(next);
  activePreset = null;
}

function shuffle() { update({ seed: newSeed() }); }


/* ==========================================================================
   6. Presets
   Each sets every setting: it starts from the defaults and changes these.
   ========================================================================== */

const PRESETS = [
  { key: 'frosted-dots',   label: 'Frosted Dots',   set: { shape: 'circle', size: 44, randomness: 10, distortion: 50, blur: 55, gap: 16, lens: 'lens', softness: 12, highlights: 40, shadows: 22, seed: 11 } },
  { key: 'water-droplets', label: 'Water Droplets', set: { shape: 'circle', size: 58, randomness: 92, distortion: 85, blur: 3, gap: 36, lens: 'lens', softness: 8, highlights: 60, shadows: 38, chroma: 18, seed: 27 } },
  { key: 'pixel-mosaic',   label: 'Pixel Mosaic',   set: { shape: 'square', roundness: 8, size: 32, randomness: 0, distortion: 60, blur: 0, gap: 0, lens: 'flat', shift: 60, softness: 0, highlights: 30, shadows: 28, seed: 5 } },

/* Give the SVG a size of its own (Firefox will not draw one without) and
   turn it into something an <img> can load. Scripts in an SVG never run there. */
function svgToUrl(text, size) {
  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== 'svg' || doc.getElementsByTagName('parsererror').length) {
    throw new Error('That file is not an SVG that can be read.');
  }
  let box = (svg.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if (box.length !== 4 || box.some(n => !Number.isFinite(n)) || box[2] <= 0 || box[3] <= 0) {
    const w = parseFloat(svg.getAttribute('width'));
    const h = parseFloat(svg.getAttribute('height'));
    if (!(w > 0 && h > 0)) throw new Error('The SVG has no size or viewBox, so its shape cannot be read.');
    box = [0, 0, w, h];
    svg.setAttribute('viewBox', box.join(' '));
  }
  const scale = size / Math.max(box[2], box[3]);
  svg.setAttribute('width', String(box[2] * scale));
  svg.setAttribute('height', String(box[3] * scale));
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  const blob = new Blob([new XMLSerializer().serializeToString(svg)], { type: 'image/svg+xml' });
  return URL.createObjectURL(blob);
}

/* One row or column of an exact squared distance transform: the lower
   envelope of parabolas over the samples (Felzenszwalb and Huttenlocher). */
function distance1D(f, n, out, v, z) {
  let k = 0;
  v[0] = 0; z[0] = -Infinity; z[1] = Infinity;
  const meet = (q, r) => (f[q] + q * q - (f[r] + r * r)) / (2 * q - 2 * r);
  for (let q = 1; q < n; q++) {
    let s = meet(q, v[k]);
    while (s <= z[k]) { k--; s = meet(q, v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = Infinity;
  }
  k = 0;
  for (let q = 0; q < n; q++) {
    while (z[k + 1] < q) k++;
    const r = v[k];
    out[q] = (q - r) * (q - r) + f[r];
  }
}
function distance2D(grid, size) {
  const f = new Float64Array(size), out = new Float64Array(size);
  const v = new Int32Array(size), z = new Float64Array(size + 1);
  for (let x = 0; x < size; x++) {
    for (let y = 0; y < size; y++) f[y] = grid[y * size + x];
    distance1D(f, size, out, v, z);
    for (let y = 0; y < size; y++) grid[y * size + x] = out[y];
  }
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) f[x] = grid[y * size + x];
    distance1D(f, size, out, v, z);
    for (let x = 0; x < size; x++) grid[y * size + x] = out[x];
  }
}

async function buildLogo(svgText, custom, name) {
  const size = CONFIG.logoResolution;
  const pad = Math.round(size * 0.1);
  const url = svgToUrl(svgText, size);
  let img;
  try { img = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const inner = size - 2 * pad;
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const k = inner / Math.max(w, h);
  ctx.drawImage(img, (size - w * k) / 2, (size - h * k) / 2, w * k, h * k);
  const alpha = ctx.getImageData(0, 0, size, size).data;

  /* distances to the nearest inside and outside texels, with the anti-aliased
     edge read as a fraction of a texel */
  const INF = 1e20;
  const toInside = new Float64Array(size * size);
  const toOutside = new Float64Array(size * size);
  let any = false;
  for (let i = 0; i < size * size; i++) {
    const a = alpha[i * 4 + 3] / 255;
    if (a > 0.5) any = true;
    toInside[i] = a >= 1 ? 0 : a <= 0 ? INF : Math.pow(Math.max(0, 0.5 - a), 2);
    toOutside[i] = a <= 0 ? 0 : a >= 1 ? INF : Math.pow(Math.max(0, a - 0.5), 2);
  }
  if (!any) throw new Error('The SVG draws nothing solid to make a tile from.');
  distance2D(toInside, size);
  distance2D(toOutside, size);
  const field = new Float32Array(size * size);
  let depth = 0;
  for (let i = 0; i < size * size; i++) {
    const d = (Math.sqrt(toInside[i]) - Math.sqrt(toOutside[i])) / size;
    field[i] = d;
    if (-d > depth) depth = -d;
  }
  logo = { field, size, depth: Math.max(depth, 0.01), custom, name };
  if (gl) uploadLogo();
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('The image could not be read.'));
    img.src = src;
  });
}

async function usePhoto(img, name) {
  const size = uploadPhoto(img);
  if (photo && photo.img.src.startsWith('blob:')) URL.revokeObjectURL(photo.img.src);
  photo = { img, name, ...size };
  document.getElementById('dims').textContent = `${size.width} × ${size.height}`;
  document.getElementById('export').disabled = false;
  layoutCanvas();
}

const ACCEPTED = ['image/png', 'image/jpeg', 'image/webp'];
async function usePhotoFile(file) {
  if (!file) return;
  if (file.type && !file.type.startsWith('image/')) { toast('That is not an image. Use a PNG, JPG or WebP.'); return; }
  if (file.type && !ACCEPTED.includes(file.type)) toast('Trying it: PNG, JPG and WebP work best.');
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    await usePhoto(img, (file.name || 'image').replace(/\.[^.]+$/, ''));
    toast('Photo in. It stays on this device.');
  } catch {
    URL.revokeObjectURL(url);
    toast('That image could not be opened. Try a PNG, JPG or WebP.');
  }
}

async function useLogoFile(file) {
  if (!file) return;
  try {
    const text = await file.text();
    await buildLogo(text, true, file.name);
    update({ shape: 'logo' });
    syncUI();
    requestRender();
    toast('Your logo is the tile now.');
  } catch (err) {
    toast(err.message || 'That SVG could not be used.');
  }
}

async function useBeetleLogo() {
  let text = BUILT_IN_LOGO;
  try {
    const res = await fetch(CONFIG.logo);
    if (res.ok) text = await res.text();
  } catch { /* opened from disk: the built-in mark stands in */ }
  await buildLogo(text, false, 'Beetle mark');
}


/* ==========================================================================
   9. Export
   Drawn again at the photo's own size, a square at a time into a buffer off
   screen, and put together on a 2D canvas, so a large photo never needs a
   viewport bigger than the device allows.
   ========================================================================== */

function exportLimits() {
  return { side: IS_IOS ? 8192 : 16384, area: IS_IOS ? 16777216 : 64e6 };
}

async function renderFull() {
  const settings = { ...state };   // the look as it was when Export was pressed, whatever changes meanwhile
  const lim = exportLimits();
  const k = Math.min(1, lim.side / Math.max(photo.width, photo.height), Math.sqrt(lim.area / (photo.width * photo.height)));
  const W = Math.max(1, Math.round(photo.width * k));
  const H = Math.max(1, Math.round(photo.height * k));
  const chunk = Math.min(CONFIG.exportChunk, gl.getParameter(gl.MAX_RENDERBUFFER_SIZE), ...gl.getParameter(gl.MAX_VIEWPORT_DIMS));

  const target = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, target);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, chunk, chunk);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0);

  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const ctx = out.getContext('2d');
  const pixels = new Uint8ClampedArray(chunk * chunk * 4);
  try {
    for (let y = 0; y < H; y += chunk) {
      for (let x = 0; x < W; x += chunk) {
        const cw = Math.min(chunk, W - x), ch = Math.min(chunk, H - y);
        drawImage({ framebuffer: fb, width: cw, height: ch, view: [x / W, y / H, cw / W, ch / H], outWidth: W, outHeight: H, settings });
        const raw = pixels.subarray(0, cw * ch * 4);
        gl.readPixels(0, 0, cw, ch, gl.RGBA, gl.UNSIGNED_BYTE, raw);
        /* the buffer's first row is the square's bottom */
        const rows = new ImageData(cw, ch);
        const stride = cw * 4;
        for (let r = 0; r < ch; r++) rows.data.set(raw.subarray((ch - 1 - r) * stride, (ch - r) * stride), r * stride);
        ctx.putImageData(rows, x, y);
        await new Promise(requestAnimationFrame);
      }
    }
  } finally {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fb);
    gl.deleteTexture(target);
    requestRender();
  }
  const blob = await new Promise(resolve => out.toBlob(resolve, 'image/png'));
  out.width = out.height = 0;
  return { blob, width: W, height: H, capped: k < 1, readSmaller: photo.texWidth < photo.width };
}

let exporting = false;
async function exportPNG() {
  if (!gl || !photo || exporting) return;
  exporting = true;
  const button = document.getElementById('export');
  button.disabled = true;
  try {
    const r = await renderFull();
    if (!r.blob) throw new Error('no blob');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(r.blob);
    a.download = `${photo.name || 'image'}-beetle-glass.png`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    if (r.capped) toast(`Exported at ${r.width} × ${r.height}. This device can’t hold the full ${photo.width} × ${photo.height}.`, 6000);
    else if (r.readSmaller) toast(`Exported at ${r.width} × ${r.height}. This device read the photo at ${photo.texWidth} × ${photo.texHeight}, so fine detail may be softer.`, 6000);
    else toast(`Exported at ${r.width} × ${r.height}.`);
  } catch {
    toast('The export did not finish. Try a smaller photo.');
  } finally {
    exporting = false;
    button.disabled = !photo;
  }
}

/* a small element builder */
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false) n.append(kid);
  return n;
}

const views = [];   // everything that shows a setting, each with its own sync()

function tipFor(key, resets = true) {

}

function slider(key, { dice = false } = {}) {
  const p = PARAMS[key];
  const id = 'c-' + key;
  const input = el('input', { type: 'range', id, min: p.min, max: p.max, step: 1, 'aria-describedby': 'tip-' + key });
  const out = el('output', { class: 'val', for: id });
  const row = el('div', { class: 'ctl', 'data-key': key },
    el('div', { class: 'ctl-head' },
      el('label', { for: id }, p.label),
      out,
      dice && el('button', {
        type: 'button', class: 'icon-btn dice', 'aria-label': 'Randomize ' + p.label.toLowerCase(), html: icon('dice'),
        onclick: () => { update({ [key]: randomValue(key) }); activePreset = null; syncUI(); },
      }),
      tipFor(key)),
    input);
  input.addEventListener('input', () => { state[key] = Number(input.value); paint(); requestRender(); });
  input.addEventListener('change', () => { commit(key); activePreset = null; syncUI(); });
  input.addEventListener('dblclick', () => { update({ [key]: DEFAULTS[key] }); syncUI(); });
  const paint = () => {
    const v = state[key];
    input.value = v;
    out.textContent = (p.format || String)(v);
    input.setAttribute('aria-valuetext', out.textContent);
    const at = (v - p.min) / (p.max - p.min) * 100;
    const zero = p.min < 0 ? (0 - p.min) / (p.max - p.min) * 100 : 0;
    input.style.setProperty('--lo', Math.min(at, zero) + '%');
    input.style.setProperty('--hi', Math.max(at, zero) + '%');
    if (p.only) row.classList.toggle('na', state.shape !== p.only);
    if (key === 'cellAspect') input.disabled = state.squareCells;
  };
  views.push({ sync: paint });

/* a row of choices that behaves as one radio group: arrows move and choose */
function segmented(key, items, label) {
  const group = el('div', { class: 'seg', role: 'radiogroup', 'aria-label': label });
  const buttons = items.map(it => el('button', {
    type: 'button', role: 'radio', class: 'seg-opt', 'data-value': it.key,
    html: (it.icon ? (it.icon === 'mark' ? icon('mark') : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">${it.icon}</svg>`) : '') + `<span>${it.label}</span>`,
    onclick: () => { update({ [key]: it.key }); activePreset = null; syncUI(); },
  }));
  group.append(...buttons);
  group.addEventListener('keydown', e => {
    const dir = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const i = items.findIndex(it => it.key === state[key]);
    const next = items[(i + dir + items.length) % items.length];
    update({ [key]: next.key }, key);
    activePreset = null;
    syncUI();
    buttons.find(b => b.dataset.value === next.key).focus();
  });
  views.push({ sync: () => buttons.forEach(b => { const on = b.dataset.value === state[key]; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; }) });
