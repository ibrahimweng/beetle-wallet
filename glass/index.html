  const input = el('input', { type: 'number', class: 'num', id, min: p.min, max: p.max, step: 1, inputmode: 'numeric', 'aria-describedby': 'tip-' + key });
  input.addEventListener('change', () => { update({ [key]: input.value }); activePreset = null; syncUI(); });
  views.push({ sync: () => { if (document.activeElement !== input) input.value = state[key]; } });
  return el('div', { class: 'ctl' }, el('div', { class: 'ctl-head' }, el('label', { for: id }, p.label), input, tipFor(key, false)));
}

/* the light's direction: a dial that turns by pointer or by arrow keys */
function dial(key) {
  const p = PARAMS[key];
  const knob = el('div', { class: 'dial-knob' });
  const out = el('output', { class: 'val' });
  const d = el('div', { class: 'dial', role: 'slider', tabindex: 0, 'aria-labelledby': 'l-' + key, 'aria-describedby': 'tip-' + key,
    'aria-valuemin': p.min, 'aria-valuemax': p.max }, knob);
  const fromPointer = e => {
    const r = d.getBoundingClientRect();
    const a = Math.atan2(-(e.clientY - r.top - r.height / 2), e.clientX - r.left - r.width / 2) * 180 / Math.PI;
    state[key] = Math.round((a + 360) % 360) % 360;
    paint(); requestRender();
  };
  d.addEventListener('pointerdown', e => { d.setPointerCapture(e.pointerId); fromPointer(e); });
  d.addEventListener('pointermove', e => { if (d.hasPointerCapture(e.pointerId)) fromPointer(e); });
  d.addEventListener('pointerup', () => { commit(key); activePreset = null; syncUI(); });
  d.addEventListener('dblclick', () => { update({ [key]: DEFAULTS[key] }); syncUI(); });
  d.addEventListener('keydown', e => {
    const step = e.shiftKey ? 15 : 5;
    const to = { ArrowLeft: state[key] + step, ArrowUp: state[key] + step, ArrowRight: state[key] - step, ArrowDown: state[key] - step, Home: 0, End: 359 }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    update({ [key]: ((Math.round(to) % 360) + 360) % 360 }, key);
    activePreset = null;
    syncUI();
  });
  const words = a => ['right', 'top right', 'top', 'top left', 'left', 'bottom left', 'bottom', 'bottom right'][Math.round(a / 45) % 8];
  const paint = () => {
    const v = state[key];
    knob.style.setProperty('--a', (-v) + 'deg');
    out.textContent = deg(v);
    d.setAttribute('aria-valuenow', v);
    d.setAttribute('aria-valuetext', `${v} degrees, from the ${words(v)}`);
  };
  views.push({ sync: paint });
  return el('div', { class: 'ctl' },
    el('div', { class: 'ctl-head' }, el('span', { class: 'lbl', id: 'l-' + key }, p.label), out, tipFor(key)),
    el('div', { class: 'dialrow' }, d, el('p', { class: 'hint' }, 'Drag, or use the arrow keys.')));
}

function group(title, open, ...kids) {
  return el('details', open ? { open: true } : {}, el('summary', { html: `<span>${title}</span>${icon('chevron')}` }), el('div', {}, ...kids));
}

function buildControls() {
  /* Simple */
  const logoRow = el('div', { class: 'logo-row', id: 'logoRow' },
    el('button', { type: 'button', class: 'btn', html: icon('upload') + '<span>Upload SVG</span>', onclick: () => document.getElementById('logoFile').click() }),
    el('button', { type: 'button', class: 'btn', id: 'beetleLogo', html: '<span>Use Beetle mark</span>',
      onclick: async () => { await useBeetleLogo(); syncUI(); requestRender(); toast('Back to the Beetle mark.'); } }));
  views.push({ sync: () => {
    logoRow.hidden = state.shape !== 'logo';
    document.getElementById('beetleLogo').disabled = !logo || !logo.custom;
  } });
  document.getElementById('pane-simple').append(
    el('div', { class: 'ctl' }, el('div', { class: 'ctl-head' }, el('span', { class: 'lbl', id: 'l-shape' }, 'Shape')),
      segmented('shape', SHAPES, 'Shape'), logoRow),
    ...SIMPLE_SLIDERS.map(k => slider(k, { dice: true })));

  /* Advanced */
  const fillColour = el('div', { class: 'ctl', id: 'fillColourRow' },
    el('div', { class: 'ctl-head' }, el('span', { class: 'lbl' }, 'Gap colour'), ...colour('fillColor')));
  views.push({ sync: () => { fillColour.hidden = state.fill !== 'colour'; } });
  document.getElementById('pane-advanced').append(
    group('Pattern', true,
      slider('angle'), toggle('squareCells'), slider('cellAspect'), slider('brick'),
      slider('rotation'), toggle('randomRotation'), slider('ovalRatio'), slider('roundness'),
      numberField('seed'), slider('margin')),
    group('Glass', true,
      el('div', { class: 'ctl' }, el('div', { class: 'ctl-head' }, el('span', { class: 'lbl' }, 'Lens style')), segmented('lens', LENSES, 'Lens style')),
      slider('shift'), slider('stretch'), slider('softness')),
    group('Light', false,
      litSlider('shadows', 'shadowColor'), litSlider('highlights', 'highlightColor'), dial('lightAngle')),
    group('Finish', false,
      el('div', { class: 'ctl' }, el('div', { class: 'ctl-head' }, el('span', { class: 'lbl' }, 'Between tiles')), segmented('fill', FILLS, 'Between tiles')),
      fillColour, slider('grain'), slider('chroma')),
    el('div', { class: 'share' },
      el('button', { type: 'button', class: 'btn', html: icon('link') + '<span>Copy link</span>', onclick: copyLink }),
      el('button', { type: 'button', class: 'btn', html: icon('copy') + '<span>Copy settings</span>', onclick: copySettings }),
      el('button', { type: 'button', class: 'btn', html: icon('paste') + '<span>Paste settings</span>', onclick: pasteSettings })));

  /* presets */
  const presetBar = document.getElementById('presets');
  for (const p of PRESETS) {
    presetBar.append(el('button', { type: 'button', class: 'chip', 'data-preset': p.key, 'aria-pressed': 'false', onclick: () => applyPreset(p.key) }, p.label));
  }
  views.push({ sync: () => {
    presetBar.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.preset === activePreset)));
    document.getElementById('seedShown').textContent = state.seed;
  } });
}

function syncUI() {
  for (const v of views) v.sync();
}

/* tabs */
function selectTab(which) {
  for (const name of ['simple', 'advanced']) {
    const tab = document.getElementById('tab-' + name);
    const on = name === which;
    tab.setAttribute('aria-selected', String(on));
    tab.tabIndex = on ? 0 : -1;
    document.getElementById('pane-' + name).hidden = !on;
  }
  try { localStorage.setItem('beetle-glass-tab', which); } catch { /* private mode */ }
}

/* the picture's size on screen: whole (Fit) or filling the stage (Fill) */
let viewMode = 'fit';
function layoutCanvas() {
  if (!photo) return;
  const vp = document.getElementById('viewport');
  const frame = document.getElementById('frame');
  const style = getComputedStyle(vp);
  const availW = vp.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const availH = vp.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
  if (availW <= 0 || availH <= 0) return;
  const ar = photo.width / photo.height;
  const wide = availW / availH > ar;
  const fit = viewMode === 'fit';
  const cssW = (fit ? wide : !wide) ? availH * ar : availW;
  const cssH = cssW / ar;
  frame.style.width = cssW + 'px';
  frame.style.height = cssH + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let pw = cssW * dpr, ph = cssH * dpr;
  const k = Math.min(1, Math.sqrt(CONFIG.maxPreviewPixels / (pw * ph)), (gl ? gl.getParameter(gl.MAX_VIEWPORT_DIMS)[0] : 4096) / Math.max(pw, ph));
  pw = Math.max(1, Math.round(pw * k));
  ph = Math.max(1, Math.round(ph * k));
  if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
  requestRender();
}

/* phones: the controls sit in a sheet; drag its handle, or press it, to raise it */
function setupSheet() {
  const panel = document.getElementById('panel');
  const grab = document.getElementById('grab');
  const button = document.getElementById('grabBtn');
  const small = window.matchMedia('(max-width: 760px)');
  const stops = () => {
    const h = window.innerHeight;
    return [Math.min(236, h * 0.42), h * 0.6, h * 0.9];
  };
  let height = 0;
  const set = (h, snap = false) => {
    const s = stops();
    if (snap) h = s.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a);
    height = Math.max(s[0], Math.min(s[2], h));
    panel.style.setProperty('--sheet', height + 'px');
    document.getElementById('stage').style.setProperty('--peek', s[0] + 'px');
    button.setAttribute('aria-expanded', String(height > s[0] + 1));
    button.setAttribute('aria-label', height > s[0] + 1 ? 'Show fewer controls' : 'Show more controls');
  };
  let start = null, moved = false;
  grab.addEventListener('pointerdown', e => { start = { y: e.clientY, h: height }; moved = false; grab.setPointerCapture(e.pointerId); panel.classList.add('dragging'); });
  grab.addEventListener('pointermove', e => {
    if (!start) return;
    if (Math.abs(e.clientY - start.y) > 4) moved = true;
    set(start.h - (e.clientY - start.y));
  });
  const end = () => { if (!start) return; start = null; panel.classList.remove('dragging'); set(height, true); };
  const flip = () => { const s = stops(); set(height > s[0] + 1 ? s[0] : s[1]); };
  /* the handle holds the pointer while it drags, so a tap is read here, where
     the pointer lets go; the button's own click is then for the keyboard */
  let tapped = false;
  grab.addEventListener('pointerup', () => {
    const tap = start && !moved;
    end();
    if (tap) { flip(); tapped = true; setTimeout(() => { tapped = false; }, 400); }
  });
  grab.addEventListener('pointercancel', end);
  button.addEventListener('click', () => { if (!tapped) flip(); });
  const reset = () => { if (small.matches) { set(stops()[0]); } layoutCanvas(); };
  small.addEventListener('change', reset);
  window.addEventListener('resize', () => { if (small.matches) set(height, true); });
  reset();
}

/* light, dark, or the device's own */
const THEMES = ['auto', 'light', 'dark'];
let theme = 'auto';
function applyTheme(t) {
  theme = t;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const b = document.getElementById('theme');
  b.innerHTML = icon(t === 'auto' ? 'auto' : t === 'light' ? 'sun' : 'moon');
  b.setAttribute('aria-label', `Theme: ${t}. Change theme`);
  b.title = `Theme: ${t}`;
  try { localStorage.setItem('beetle-glass-theme', t); } catch { /* private mode */ }
}

let toastTimer = 0;
function toast(text, ms = 3200) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), ms);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}
async function copyLink() {
  writeHash();
  const ok = await copyText(location.href);
  const note = logo && logo.custom && state.shape === 'logo' ? ' Your own logo stays on this device, so the link shows the Beetle mark.' : '';
  toast((ok ? 'Link copied. It carries the settings, never your photo.' : 'Copy the address bar: it carries the settings, never your photo.') + note, 5000);
}
async function copySettings() {
  const ok = await copyText(settingsJSON());
  if (ok) { toast('Settings copied as JSON.'); return; }
  const dlg = document.getElementById('pasteDialog');
  document.getElementById('pasteTitle').textContent = 'Copy settings';
  document.getElementById('pasteText').value = settingsJSON();
  document.getElementById('pasteApply').hidden = true;
  dlg.showModal();
  document.getElementById('pasteText').select();
}
async function pasteSettings() {
  let text = '';
  try { text = await navigator.clipboard.readText(); } catch { /* not allowed: ask instead */ }
  const parsed = text && readSettingsJSON(text);
  if (parsed) { update({ ...DEFAULTS, ...parsed }); activePreset = null; syncUI(); toast('Settings pasted.'); return; }
  const dlg = document.getElementById('pasteDialog');
  document.getElementById('pasteTitle').textContent = 'Paste settings';
  document.getElementById('pasteText').value = '';
  document.getElementById('pasteApply').hidden = false;
  dlg.showModal();
}

function wireUp() {
  buildControls();

  const setIcon = (id, name, label) => { document.getElementById(id).innerHTML = icon(name) + (label ? `<span>${label}</span>` : ''); };
  setIcon('undo', 'undo');
  setIcon('redo', 'redo');
  setIcon('export', 'download', 'Export');
  setIcon('shuffle', 'shuffle', 'Shuffle');
  setIcon('randomize', 'sparkle', 'Randomize all');
  setIcon('pick', 'photo', 'Replace photo');
  document.getElementById('private').innerHTML = icon('lock') + '<span>Your image never leaves your device</span>';
  document.getElementById('pick').title = 'Pick, drop or paste a PNG, JPG or WebP';

  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('redo').addEventListener('click', redo);
  document.getElementById('reset').addEventListener('click', () => { update({ ...DEFAULTS }); activePreset = null; syncUI(); toast('Back to the defaults. Undo brings your look back.'); });
  document.getElementById('export').addEventListener('click', exportPNG);
  document.getElementById('shuffle').addEventListener('click', () => { shuffle(); syncUI(); });
  document.getElementById('randomize').addEventListener('click', () => { randomizeAll(); syncUI(); });
  document.getElementById('theme').addEventListener('click', () => applyTheme(THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]));

  /* tabs, with arrow keys between them */
  for (const name of ['simple', 'advanced']) {
    const tab = document.getElementById('tab-' + name);
    tab.addEventListener('click', () => selectTab(name));
    tab.addEventListener('keydown', e => {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      const other = name === 'simple' ? 'advanced' : 'simple';
      selectTab(other);
      document.getElementById('tab-' + other).focus();
    });
  }

  /* Fit or Fill */
  const viewButtons = [...document.querySelectorAll('#view .seg-opt')];
  const setView = mode => {
    viewMode = mode;
    viewButtons.forEach(b => { const on = b.dataset.value === mode; b.setAttribute('aria-checked', String(on)); b.tabIndex = on ? 0 : -1; });
    document.getElementById('viewport').classList.toggle('fill', mode === 'fill');
    layoutCanvas();
  };
  viewButtons.forEach(b => b.addEventListener('click', () => setView(b.dataset.value)));
  document.getElementById('view').addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const next = viewMode === 'fit' ? 'fill' : 'fit';
    setView(next);
    viewButtons.find(b => b.dataset.value === next).focus();
  });

  /* photos in: the picker, dropping on the stage, pasting anywhere */
  const file = document.getElementById('file');
  document.getElementById('pick').addEventListener('click', () => file.click());
  file.addEventListener('change', () => { usePhotoFile(file.files[0]); file.value = ''; });
  const logoFile = document.getElementById('logoFile');
  logoFile.addEventListener('change', () => { useLogoFile(logoFile.files[0]); logoFile.value = ''; });

  const stage = document.getElementById('stage');
  const drop = document.getElementById('drop');
  let depth = 0;
  const hasFiles = e => [...(e.dataTransfer ? e.dataTransfer.types : [])].includes('Files');
  stage.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; drop.hidden = false; });
  stage.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  stage.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) drop.hidden = true; });
  stage.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; drop.hidden = true;
    const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/'));
    if (f && f.type === 'image/svg+xml') useLogoFile(f);
    else if (f) usePhotoFile(f);
    else toast('Drop a PNG, JPG or WebP.');
  });
  window.addEventListener('paste', e => {
    const t = e.target;
    if (t instanceof HTMLTextAreaElement || (t instanceof HTMLInputElement && t.type !== 'range')) return;
    const items = [...(e.clipboardData ? e.clipboardData.items : [])];
    const img = items.find(i => i.kind === 'file' && i.type.startsWith('image/'));
    if (img) { e.preventDefault(); usePhotoFile(img.getAsFile()); return; }
    const text = e.clipboardData && e.clipboardData.getData('text/plain');
    const parsed = text && readSettingsJSON(text);
    if (parsed) { e.preventDefault(); update({ ...DEFAULTS, ...parsed }); activePreset = null; syncUI(); toast('Settings pasted.'); }
  });

  /* the settings dialog */
  document.getElementById('pasteDialog').addEventListener('close', () => {
    const dlg = document.getElementById('pasteDialog');
    if (dlg.returnValue !== 'apply') return;
    const parsed = readSettingsJSON(document.getElementById('pasteText').value);
    if (!parsed) { toast('Those settings could not be read.'); return; }
    update({ ...DEFAULTS, ...parsed });
    activePreset = null;
    syncUI();
    toast('Settings pasted.');
  });

  /* keys: undo and redo, unless a text field is taking them */
  window.addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (!mod) return;
    const t = e.target;
    if (t instanceof HTMLTextAreaElement || (t instanceof HTMLInputElement && (t.type === 'number' || t.type === 'text'))) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
  });

  new ResizeObserver(() => layoutCanvas()).observe(document.getElementById('viewport'));
  setupSheet();
}


/* ==========================================================================
   11. Utilities
   ========================================================================== */

function hexToRgb(hex) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
}

/* For the browser test (glass/test/glass.mjs): it reads and drives the page
   through these rather than guessing at pixels on screen. */
function probe() {
  renderNow();
  const w = canvas.width, h = canvas.height;
  const px = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sum = [0, 0, 0, 0], sq = 0, n = w * h;
  for (let i = 0; i < px.length; i += 4) {
    for (let c = 0; c < 4; c++) sum[c] += px[i + c];
    const l = (px[i] + px[i + 1] + px[i + 2]) / 3;
    sq += l * l;
  }
  const mean = sum.map(s => s / n);
  const lum = (mean[0] + mean[1] + mean[2]) / 3;
  let hash = 0;
  for (let i = 0; i < px.length; i += 997) hash = (hash * 31 + px[i]) >>> 0;
  return { width: w, height: h, mean, spread: Math.sqrt(Math.max(0, sq / n - lum * lum)), hash };
}


/* ==========================================================================
   12. Start
   ========================================================================== */

let readyResolve;
const ready = new Promise(r => { readyResolve = r; });
window.beetleGlass = {
  ready,
  get state() { return { ...state }; },
  get history() { return { index: history.index, length: history.stack.length }; },
  get logo() { return logo && { custom: logo.custom, depth: logo.depth, name: logo.name }; },
  get photo() { return photo && { width: photo.width, height: photo.height, name: photo.name }; },
  update, undo, redo, shuffle, randomizeAll, applyPreset, probe, settingsJSON,
  exportBlob: () => renderFull(),
  useLogoText: (text, name) => buildLogo(text, true, name).then(() => { update({ shape: 'logo' }); syncUI(); }),
};

(async function start() {
  try { applyTheme(localStorage.getItem('beetle-glass-theme') || 'auto'); } catch { applyTheme('auto'); }
  wireUp();
  let tab = 'simple';
  try { tab = localStorage.getItem('beetle-glass-tab') || 'simple'; } catch { /* private mode */ }
  selectTab(tab === 'advanced' ? 'advanced' : 'simple');

  state = { ...DEFAULTS, ...decodeSettings(location.hash) };
  syncUI();
  commit();

  let ok = false;
  try { ok = setupGL(); } catch (err) { console.error(err); }
  if (!ok) {
    document.getElementById('frame').hidden = true;
    document.getElementById('viewport').append(el('div', { class: 'notice', role: 'alert' },
      el('h2', {}, 'This browser can’t draw the glass'),
      el('p', {}, 'Beetle Glass needs WebGL 2, which this browser has turned off or does not have. Try the latest Chrome, Safari or Firefox, or switch on hardware acceleration in your browser’s settings.')));
    document.querySelectorAll('#panel button, #panel input, #pick').forEach(b => { b.disabled = true; });
    readyResolve({ webgl: false });
    return;
  }

  try {
    await useBeetleLogo();
    const img = await loadImage(CONFIG.sampleImage);
    await usePhoto(img, 'beetle-sample');
  } catch (err) {
    console.error(err);
    document.getElementById('frame').classList.remove('loading');
    toast('The sample photo could not be loaded. Drop in one of your own.', 6000);
  }
  syncUI();
  renderNow();
  readyResolve({ webgl: true });
})();
</script>
