name: Tests

# Every screen has to draw, and the money has to actually move. This is the
# check that matters, so it stands on its own: red here means something broke.

on:
  push:
  pull_request:
  workflow_dispatch:

# The token the run is given can read the repository and nothing more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Every screen draws, and the money really moves
        run: npm test
      - name: The committed bundle matches the source
        run: git diff --exit-code dist/ || (echo 'dist/beetle.html is stale — run `npm run build` and commit it'; exit 1)
      - name: The icon library matches its sources and every icon renders
        run: node glyphs/tools/build-library.mjs --check
      - name: The Figma plugin matches the site it is built from, and every icon reaches Figma whole
        run: node glyphs/tools/build-figma-plugin.mjs --check
      - name: The Figma plugin's panel works in a browser
        run: node glyphs/figma-plugin/test/ui.mjs

  # The product app in wallet/: it compiles, the rules of the way in hold, the
  # web bundle builds, and the whole way in runs in a browser from the loading
  # screen to home. The pictures it takes are kept with the run.
  wallet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wallet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wallet/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: It compiles and the rules of the way in hold
        run: npm run typecheck && npm test
      - name: The way in runs in a browser, from the loading screen to home
        run: npm run bundle && npm run flow
      - name: Every screen is drawn to its frame
        run: npm run figma
      - name: The test site builds around the web bundle
        run: node site/build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-screens
          path: wallet/shots
          if-no-files-found: ignore
