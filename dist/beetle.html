<title>Beetle</title>
<style>
/* Beetle — design tokens, taken from the Figma file
   Colours, type scale, radii and spacing are the values actually used in the
   design, not approximations. Extracted 2026-09. */

:root {
  /* ink and surface */
  --ink:            #000000;
  --surface:        #ffffff;
  --surface-2:      #f5f5f7;   /* card grey, the most used fill after black/white */
  --surface-3:      #efeff1;
  --surface-4:      #fafafa;

  /* text */
  --text:           #000000;
  --text-secondary: #8e8e93;
  --text-tertiary:  #a9a9ae;
  --text-inverse:   #ffffff;

  /* accent */
  --accent:         #213aca;
  --accent-deep:    #1d33b2;
  --accent-wash:    #eff1fb;

  /* semantic */
  --good:           #34c759;
  --good-text:      #11823b;
  --warn:           #f5a524;
  --bad:            #cc2a20;
  --bad-bright:     #ff3b30;
  --violet:         #8b5cf6;
  --cyan:           #22b8e8;

  /* lines */
  --rule:           #dedee3;
  --rule-strong:    #c4c4c9;
  --scrim:          rgba(120, 120, 124, 0.42);

  /* type */
  --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --t-display: 700 32px/1.15 var(--font);
  --t-title:   600 32px/1.2  var(--font);
  --t-head:    600 20px/1.3  var(--font);
  --t-row:     600 16px/1.5  var(--font);
  --t-body:    400 16px/1.5  var(--font);
  --t-label:   600 14px/1.45 var(--font);
  --t-meta:    400 14px/1.45 var(--font);
  --t-caption: 400 12px/1.4  var(--font);
  --t-key:     400 22px/1    var(--font);

  /* radii */
  --r-xs: 6px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 24px;
  --r-pill: 999px;

  /* spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 20px;
  --s-6: 24px;

  /* device */
  --screen-w: 393px;
  --screen-h: 852px;
}

/* Beetle — the harness around the phone, plus every in-app component.
   Nothing here is a framework. Plain CSS, plain DOM. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: #16181d;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ---------- harness ---------- */
.harness { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }
@media (max-width: 900px) { .harness { grid-template-columns: 1fr; } .rail { display: none; } }
/* On a phone the mockup is wider than the window, so shrink it to fit rather
   than let the page scroll sideways. */
@media (max-width: 520px) {
  .stage { padding: 14px 8px 40px; }
  .phone { transform: scale(.86); transform-origin: top center; margin-bottom: -120px; }
}
@media (max-width: 440px) { .phone { transform: scale(.74); margin-bottom: -220px; } }

.rail {
  background: #1d2027; border-right: 1px solid #2a2e37;
  overflow-y: auto; padding: 20px 0 60px;
}
.rail-brand { padding: 4px 20px 18px; display: flex; align-items: baseline; gap: 10px; }
.rail-brand b { color: #fff; font: 600 20px/1 var(--font); letter-spacing: -0.01em; }
.rail-brand span { color: #7d8492; font: 400 11px/1 var(--font); }
.rail-search {
  margin: 0 16px 16px; width: calc(100% - 32px); padding: 9px 12px;
  background: #262a33; border: 1px solid #333845; border-radius: 8px;
  color: #e6e8ec; font: 400 13px var(--font);
}
.rail-search::placeholder { color: #6c7280; }
.rail-act {
  color: #6c7280; font: 600 10px/1 var(--font); letter-spacing: .14em;
  text-transform: uppercase; padding: 18px 20px 8px;
}
.rail-sec { color: #9aa1ad; font: 600 12px/1.4 var(--font); padding: 9px 20px 4px; }
.rail-link {
  display: flex; justify-content: space-between; gap: 8px; align-items: center;
  padding: 6px 20px 6px 32px; color: #c3c8d2; font: 400 13px/1.4 var(--font);
  cursor: pointer; border: 0; background: none; width: 100%; text-align: left;
}
.rail-link:hover { background: #262a33; color: #fff; }
.rail-link[aria-current="true"] { background: var(--accent); color: #fff; }
.rail-link em { font-style: normal; color: #6c7280; font-size: 11px; }
.rail-link[aria-current="true"] em { color: #c3cbf5; }

/* ---------- stage ---------- */
.stage {
  display: flex; flex-direction: column; align-items: center;
  overflow-y: auto; padding: 28px 20px 60px;
}
.stage-head {
  width: 100%; max-width: 900px; display: flex; align-items: flex-start;
  justify-content: space-between; gap: 20px; margin-bottom: 18px; flex-wrap: wrap;
}
.stage-title { color: #fff; font: 600 17px/1.3 var(--font); margin: 0 0 3px; }
.stage-sub { color: #8b929e; font: 400 13px/1.5 var(--font); margin: 0; max-width: 60ch; }
.stage-nav { display: flex; gap: 8px; align-items: center; }
.stage-btn {
  background: #262a33; color: #d7dbe2; border: 1px solid #333845;
  border-radius: 8px; padding: 7px 12px; font: 500 12px var(--font); cursor: pointer;
}
.stage-btn:hover { background: #333845; color: #fff; }
.stage-btn:disabled { opacity: .35; cursor: default; }
.stage-count { color: #6c7280; font: 400 12px var(--font); padding: 0 2px; }

/* ---------- phone ---------- */
.phone {
  width: 421px; flex: none; border-radius: 54px; padding: 14px;
  background: linear-gradient(160deg, #3a3f4a, #22262e 40%, #33384200 70%), #2b2f38;
  box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 1px #454b57 inset;
}
.phone-screen {
  width: var(--screen-w); height: var(--screen-h);
  background: var(--surface); border-radius: 42px; overflow: hidden;
  position: relative; isolation: isolate;
}
.phone-screen::before {
  /* Content scrolls under the notch, so fade it out on the way up rather
     than letting the black pill slice a headline in half. */
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 80;
  background: linear-gradient(to bottom, var(--surface) 42%, rgba(255,255,255,0));
  pointer-events: none;
}
.phone-notch {
  position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
  width: 108px; height: 30px; background: #000; border-radius: 999px; z-index: 90;
}
.screen-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; }
.screen-scroll::-webkit-scrollbar { width: 0; }

/* ---------- in-app primitives ---------- */
.pad { padding: 0 var(--s-5); }
.stack { display: flex; flex-direction: column; }
.gap-1 { gap: var(--s-1); } .gap-2 { gap: var(--s-2); }
.gap-3 { gap: var(--s-3); } .gap-4 { gap: var(--s-4); }
.gap-5 { gap: var(--s-5); } .gap-6 { gap: var(--s-6); }
.row { display: flex; align-items: center; gap: var(--s-3); }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.center { align-items: center; text-align: center; justify-content: center; }
.top-pad { padding-top: 72px; }
.bottom-pad { padding-bottom: 124px; }

.t-display { font: var(--t-display); letter-spacing: -0.02em; }
.t-title   { font: var(--t-title); letter-spacing: -0.015em; }
.t-head    { font: var(--t-head); letter-spacing: -0.01em; }
.t-row     { font: var(--t-row); }
.t-body    { font: var(--t-body); }
.t-label   { font: var(--t-label); }
.t-meta    { font: var(--t-meta); }
.t-caption { font: var(--t-caption); }
.c-2 { color: var(--text-secondary); }
.c-3 { color: var(--text-tertiary); }
.c-accent { color: var(--accent-deep); }
.c-good { color: var(--good-text); }
.c-bad { color: var(--bad); }
.c-inv { color: var(--text-inverse); }

.card { background: var(--surface-2); border-radius: var(--r-md); padding: var(--s-4); }
.card-plain { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-md); padding: var(--s-4); }
.divider { height: 1px; background: var(--rule); }

.glyph {
  width: 36px; height: 36px; flex: none; border-radius: 10px;
  background: var(--surface-2); display: grid; place-items: center;
  font-size: 17px; line-height: 1;
}
.glyph-lg { width: 56px; height: 56px; border-radius: var(--r-md); font-size: 24px; }
.glyph-accent { background: var(--accent); color: #fff; }
.glyph-good { background: var(--good); color: #fff; }
.glyph-bad { background: var(--bad-bright); color: #fff; }
.glyph-warn { background: var(--warn); color: #fff; }
.glyph-circle { border-radius: 999px; }

.listrow { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) 0; cursor: pointer; }
.listrow:hover .listrow-title { color: var(--accent-deep); }
.listrow-title { font: var(--t-row); }
.listrow-sub { font: var(--t-meta); color: var(--text-tertiary); }
.chev { color: var(--rule-strong); font-size: 18px; flex: none; }

.btn {
  border: 0; border-radius: var(--r-pill); padding: 15px 22px; width: 100%;
  font: 600 16px var(--font); cursor: pointer; display: flex;
  align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--ink); color: #fff; }
.btn-accent  { background: var(--accent); color: #fff; }
.btn-quiet   { background: var(--surface-2); color: var(--ink); }
.btn-ghost   { background: none; color: var(--accent-deep); font: 600 14px var(--font); padding: 10px; }
.btn:active { transform: scale(.985); }

.chip {
  border-radius: var(--r-pill); padding: 8px 14px; font: 600 14px var(--font);
  background: var(--surface-2); color: var(--text-secondary); border: 0; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }

.bubble {
  background: var(--accent-wash); border-radius: var(--r-md);
  padding: var(--s-3) var(--s-4); font: var(--t-body); max-width: 300px;
}
.bubble-me { background: var(--ink); color: #fff; border-radius: var(--r-pill); padding: 12px 18px; }
.agent-mark {
  width: 28px; height: 28px; flex: none; border-radius: 9px; background: var(--accent);
  display: grid; place-items: center; color: #fff; font-size: 13px;
}

.banner { border-radius: var(--r-sm); padding: 12px var(--s-4); font: 600 16px var(--font); }
.banner-good { background: var(--good); color: #fff; }
.banner-warn { background: #fdf2dd; color: #7a5b12; }

.note { display: flex; gap: 8px; align-items: flex-start; font: var(--t-caption); color: var(--text-tertiary); }

/* dock */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
  display: flex; align-items: center; gap: 10px; padding: 10px 16px 22px;
  background: linear-gradient(to top, var(--surface) 62%, rgba(255,255,255,0));
  /* only the controls take taps: the gradient above them must not swallow a
     press meant for the screen underneath */
  pointer-events: none;
}
.dock > * { pointer-events: auto; }

.askbar {
  flex: 1; height: 48px; border-radius: var(--r-pill); background: var(--surface-2);
  display: flex; align-items: center; gap: 10px; padding: 0 14px; min-width: 0;
}
.askbar input {
  flex: 1; border: 0; background: none; font: var(--t-body); color: var(--ink);
  outline: none; min-width: 0;
}
.askbar input::placeholder { color: var(--text-tertiary); }
.fab {
  width: 56px; height: 56px; flex: none; border-radius: 999px; background: var(--ink);
  color: #fff; border: 0; font-size: 22px; cursor: pointer; display: grid; place-items: center;
}
.backbtn { width: 44px; height: 44px; flex: none; border: 0; background: none; font-size: 20px; cursor: pointer; }

/* sheet + scrim */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 70; }
.sheet {
  position: absolute; left: 10px; right: 10px; bottom: 0; z-index: 80;
  background: var(--surface); border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: var(--s-4) var(--s-5) var(--s-6); max-height: 82%; overflow-y: auto;
}
.sheet-grab { width: 38px; height: 4px; border-radius: 2px; background: var(--rule-strong); margin: 0 auto 14px; }

/* keypad */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: var(--s-4) 28px; }
.key {
  height: 66px; border-radius: 999px; background: var(--surface-2); border: 0;
  font: var(--t-key); cursor: pointer; display: grid; place-items: center;
}
.key:active { background: var(--rule); }
.key-blank { background: none; }
.pips { display: flex; gap: 14px; justify-content: center; padding: 10px 0 4px; }
.pip { width: 11px; height: 11px; border-radius: 999px; background: var(--rule-strong); }
.pip.on { background: var(--ink); }

/* tool panel — the agent showing its working */
.tool { border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; }
.tool-head { display: flex; align-items: center; gap: 8px; padding: 10px var(--s-3); background: var(--surface-2); }
.tool-head b { font: var(--t-label); flex: 1; }
.tool-state { font: var(--t-caption); color: var(--accent-deep); display: flex; align-items: center; gap: 5px; }
.tool-row { display: flex; align-items: center; gap: 10px; padding: 11px var(--s-3); border-top: 1px solid var(--rule); }
.tool-row .k { font: var(--t-meta); color: var(--text-tertiary); flex: 1; }
.tool-row .v { font: var(--t-label); }
.tick { width: 18px; height: 18px; border-radius: 999px; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 10px; flex: none; }
.tick-wait { background: var(--surface); border: 2px solid var(--rule-strong); }

/* progress + misc */
.meter { height: 8px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.timeline-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.pill { border-radius: 999px; padding: 4px 10px; font: 600 12px var(--font); }
.pill-good { background: #e2f3e9; color: var(--good-text); }
.pill-warn { background: #fdf2dd; color: #7a5b12; }
.pill-accent { background: var(--accent-wash); color: var(--accent-deep); }

.waveform { display: flex; align-items: center; gap: 3px; height: 34px; }
.waveform i { width: 3px; border-radius: 2px; background: var(--accent); display: block; }

.kbd { background: var(--surface-3); padding: 8px 3px 22px; }
.kbd-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 8px; }
.kbd-key {
  min-width: 30px; height: 40px; border-radius: 5px; background: #fff; border: 0;
  font: 400 20px var(--font); box-shadow: 0 1px 0 #8e8e93; cursor: pointer;
  display: grid; place-items: center; flex: 1;
}
.kbd-key.wide { flex: 1.6; font-size: 13px; }
.kbd-key.dark { background: var(--rule-strong); }

/* agent typing indicator */
.typing { display: inline-flex; gap: 4px; align-items: center; }
.typing i { width: 6px; height: 6px; border-radius: 999px; background: var(--text-tertiary); animation: blink 1.1s infinite; }
.typing i:nth-child(2) { animation-delay: .18s; }
.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25 } 30% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }

/* ---------- things you can actually operate ---------- */
.toggle {
  width: 51px; height: 31px; border-radius: 999px; background: var(--rule-strong);
  border: 0; padding: 2px; cursor: pointer; flex: none; position: relative;
  transition: background .18s ease;
}
.toggle[aria-checked="true"] { background: var(--good); }
.toggle i {
  display: block; width: 27px; height: 27px; border-radius: 999px; background: #fff;
  box-shadow: 0 2px 5px rgba(0,0,0,.22); transition: transform .18s cubic-bezier(.4,.9,.3,1);
}
.toggle[aria-checked="true"] i { transform: translateX(20px); }

.amount-line {
  display: flex; align-items: baseline; justify-content: center; gap: 1px;
  font: 700 44px/1.1 var(--font); letter-spacing: -0.02em; min-height: 52px;
}
.amount-line .ghost { color: var(--rule-strong); }
.amount-caret {
  width: 3px; height: 38px; background: var(--accent); border-radius: 2px;
  animation: blink 1.05s steps(1) infinite; align-self: center;
}
@keyframes blink { 50% { opacity: 0; } }

.slide {
  position: relative; height: 58px; border-radius: 999px; background: var(--surface-2);
  overflow: hidden; user-select: none; touch-action: none;
}
.slide-fill { position: absolute; inset: 0; width: 0; background: var(--accent); border-radius: 999px; }
.slide-label {
  position: absolute; inset: 0; display: grid; place-items: center;
  font: 600 16px var(--font); color: var(--text-secondary); pointer-events: none;
}
.slide-thumb {
  position: absolute; top: 4px; left: 4px; width: 50px; height: 50px; border-radius: 999px;
  background: var(--ink); color: #fff; display: grid; place-items: center;
  font-size: 20px; cursor: grab; z-index: 2;
}
.slide.armed .slide-thumb { background: var(--good); cursor: default; }
.slide.armed .slide-label { color: #fff; }

.toast {
  position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 200;
  background: rgba(20,20,22,.94); color: #fff; border-radius: 14px;
  padding: 12px 14px; font: 500 14px/1.4 var(--font);
  box-shadow: 0 12px 30px rgba(0,0,0,.3);
  animation: toast-in .22s cubic-bezier(.2,.9,.3,1);
}
.toast.out { animation: toast-out .2s ease forwards; }
@keyframes toast-in  { from { transform: translateY(14px); opacity: 0; } }
@keyframes toast-out { to   { transform: translateY(10px); opacity: 0; } }

.edit-row { cursor: pointer; }
.edit-row:hover .t-row { color: var(--accent-deep); }
.edit-hint { font: 500 12px var(--font); color: var(--accent-deep); }

.pip.err { background: var(--bad-bright); }
.shake { animation: shake .34s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); }
}

/* ---------- movement ---------- */
.screen-scroll { animation: screen-in .26s cubic-bezier(.22,.9,.3,1); }
@keyframes screen-in { from { opacity: 0; transform: translateY(8px); } }
.phone-screen.back .screen-scroll { animation: screen-back .26s cubic-bezier(.22,.9,.3,1); }
@keyframes screen-back { from { opacity: 0; transform: translateX(-14px); } }
.sheet { animation: sheet-up .3s cubic-bezier(.2,.9,.3,1); }
@keyframes sheet-up { from { transform: translateY(70%); } }
.scrim { animation: fade-in .3s ease; }
@keyframes fade-in { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .screen-scroll, .sheet, .scrim, .toast { animation: none; }
}

.press { transition: transform .09s ease; }
.press:active { transform: scale(.97); }
.card[role="button"], .listrow[role="button"] { cursor: pointer; }

/* ---------- harness state menu ---------- */
.stage-btn.warn { color: #ffb4ad; border-color: #6a3a35; }
.rail-foot { padding: 16px 18px 0; border-top: 1px solid #2a2e37; margin-top: 18px; }
.rail-foot p { color: #6c7280; font: 400 11px/1.5 var(--font); margin: 8px 0 0; }

</style>

const FEE_FLAT = 25;          // NIP
const VAT = 0.075;            // on the fee, not the amount

/** What a transfer costs. Under ₦10,000 carries none, as the design says. */
const feeFor = amount => (amount < 10000 ? 0 : Math.round(FEE_FLAT * (1 + VAT) * 100) / 100);

/** Can this leave, and if not, why not. The screens use the reason verbatim. */
function check({ amount, from = 'everyday' }) {
  const s = get();
  if (!amount || amount <= 0) return { ok: false, code: 'none', why: 'Put an amount in first.' };
  if (s.frozen) return { ok: false, code: 'frozen', why: 'The account is frozen. Nothing can leave it until you unfreeze it.' };
  const fee = feeFor(amount);
  const need = from === 'dollars' ? amount : amount + fee;
  const have = from === 'dollars' ? dollarsInNaira() : s.everyday;
  if (need > have) return { ok: false, code: 'short', why: 'There is not enough in that account.', short: need - have };
  if (amount > s.limits.transfer) return { ok: false, code: 'transfer-limit', why: 'That is past the most you allow in one transfer.', over: amount - s.limits.transfer };
  if (s.outToday + amount > s.limits.day) return { ok: false, code: 'day-limit', why: 'That is past the most you allow in a day.', over: s.outToday + amount - s.limits.day };
  return { ok: true, fee, total: amount + fee };
}

function send({ to, amount, from = 'everyday', narration = '', icon = '↗', kind = 'transfer' }) {
  const fee = feeFor(amount);
  const inDollars = from === 'dollars' ? +(amount / get().rate).toFixed(2) : null;

  update(s => {
    if (from === 'dollars') s.dollars = +(s.dollars - amount / s.rate).toFixed(2);
    else s.everyday = +(s.everyday - amount - fee).toFixed(2);
    s.outToday += amount;
  });

  addEntry({
    icon, name: to.name, detail: narration || 'Transfer', amount: -amount, to: 'donesend', kind,
  });

  return {
    to, amount, fee, from, narration, inDollars,
    total: +(amount + fee).toFixed(2),
    balanceAfter: get().everyday,
    at: stamp(),
    session: sessionId(),
    arrives: 'In a few seconds',

  update(s => { s.everyday = +(s.everyday - amount).toFixed(2); s.outToday += amount; });

    const started = Date.now();
    const t = setInterval(() => {
      if (window.claude && typeof window.claude.use === 'function') { clearInterval(t); resolve(true); }
      else if (Date.now() - started > ms) { clearInterval(t); resolve(false); }
    }, 120);
  });
}

async function initAgent() {
  try {
    if (await waitForClaude()) {
      const s = await window.claude.use('sample');
      if (s) { sampleFn = s; mode = 'sample'; return mode; }
    }
  } catch (e) { /* fall through */ }
  const key = await localKey();
  mode = key ? 'key' : 'offline';
  return mode;
}

function fallbackReply(text) {
  for (const [re, reply] of FALLBACK()) if (re.test(text)) return reply;
  return 'I only tell you things I have seen in your own money, and I have not seen that. Ask me about a payment, a limit, or anything that went wrong.';
}

/**
 * Ask the agent something.
 * @param {string} text        what the person typed
 * @param {object} opts        { context, onText }
 * @returns {Promise<string>}  the whole answer
 */
async function ask(text, { context = '', onText } = {}) {
  if (mode === 'pending') await initAgent();
  const system = voice() + (context ? `\n\nThe person is looking at: ${context}` : '');

  if (mode === 'sample' && sampleFn) {
    try {
      const res = await sampleFn(
        [{ role: 'user', content: `${system}\n\n---\n\n${text}` }],
        { modelTier: 'default', onText: onText ? ({ text }) => onText(text) : undefined }
      );
      return res.text;
    } catch (err) {
      if (err && err.code === 'not_granted') mode = 'offline';
      return fallbackReply(text);
    }
  }

  if (mode === 'key') {
    const key = await localKey();
    try {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({
          model: 'claude-sonnet-5',
          max_tokens: 400,
          system,
          messages: [{ role: 'user', content: text }],
        }),
      });
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      const out = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
      if (onText) onText(out);
      return out || fallbackReply(text);
    } catch (err) {
      return fallbackReply(text);
    }
  }

  const out = fallbackReply(text);
  if (onText) onText(out);
  return out;
}

return { agentMode, initAgent, ask };
})();

   an amount, with k and m for thousands and millions. What it worked out is

  const t = text.toLowerCase();
  const who = PEOPLE.find(c => t.includes(c.name.split(' ')[0].toLowerCase()));
  const m = t.match(/(\d+(?:\.\d+)?)\s*([km])?/);
  let amount = null;
  if (m) {
    amount = Number(m[1]);
    if (m[2] === 'k') amount *= 1000;
    if (m[2] === 'm') amount *= 1000000;
  }
  return { who, amount };
};

const qr = () => {
  const N = 21;
  const grid = Array.from({ length: N }, () => Array(N).fill(null));

  const finder = (ox, oy) => {
    for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
      const gx = ox + x, gy = oy + y;
      if (gx < 0 || gy < 0 || gx >= N || gy >= N) continue;
      const ring = x === 0 || x === 6 || y === 0 || y === 6;
      const core = x >= 2 && x <= 4 && y >= 2 && y <= 4;
      const inside = x >= 0 && x <= 6 && y >= 0 && y <= 6;
      grid[gy][gx] = inside ? (ring || core) : false;   // false is the separator
    }
  };
  finder(0, 0); finder(N - 7, 0); finder(0, N - 7);

  for (let i = 8; i < N - 8; i++) { grid[6][i] = i % 2 === 0; grid[i][6] = i % 2 === 0; }
  grid[N - 8][8] = true;   // the dark module every code carries

  let s = 99;
  const cells = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    s = (s * 1103515245 + 12345) % 2147483648;
    const on = grid[y][x] === null ? (s % 100) > 47 : grid[y][x];
    if (on) cells.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`);
  }

  return e('div', { style: { background: '#fff', padding: '14px', borderRadius: '16px', alignSelf: 'center' } },
    e('svg', { width: '176', height: '176', viewBox: '-1 -1 23 23', 'shape-rendering': 'crispEdges', html: cells.join('') }));
};

        e('button', { class: 'btn btn-primary grow press', onClick: () => { goalSheet = 'add'; repaint(); } }, 'Add money'),
        e('button', { class: 'btn btn-quiet grow press', onClick: () => { goalSheet = 'take'; repaint(); } }, 'Take some back')),
      Button(g.paused ? 'Start feeding it again' : 'Pause feeding it', {
        kind: 'quiet',

const listed = ACTS.flatMap(a => a.sections.flatMap(s => s.screens));

const M$src_app_js = (function () {
/* Beetle — the harness. Phone frame, routing, and the index down the left. */

const { el } = M$src_ui_js;
const { SCREENS, ACTS } = M$src_screens_index_js;
const { initAgent } = M$src_agent_js;
const { get, reset : resetStore } = M$src_store_js;
const { clear : clearDraft } = M$src_flow_js;
const e = el;
const flat = () => ACTS.flatMap(a => a.sections.flatMap(s => s.screens));

let current = null;
let trail = [];
let direction = 'forward';

function go(id, push = true) {
  if (!SCREENS[id]) {
    /* only ever a mistyped address: the registry checks itself at load */
    if (id) console.warn(`No screen called "${id}". Showing the first one.`);
    id = flat()[0];
  }

  /* going back to where you just came from should feel like going back */
  if (trail[trail.length - 2] === id) { trail.pop(); direction = 'back'; }
  else if (id !== current) { trail.push(id); direction = 'forward'; }
  if (trail.length > 40) trail = trail.slice(-40);

  current = id;
  if (push && location.hash !== '#/' + id) location.hash = '#/' + id;
  paint();
}
window.beetleGo = go;                    // screens move between each other with this
window.beetleRepaint = () => paint();    // and redraw in place after changing something
window.beetleState = get;                // handy in the console, and what the tests read

function meta(id) {
  for (const a of ACTS) for (const s of a.sections) if (s.screens.includes(id)) return { act: a.name, section: s.name, aim: s.aim };
  return { act: '', section: '', aim: '' };
}

function paintRail(filter = '') {
  const rail = document.getElementById('rail-body');
  rail.innerHTML = '';
  const q = filter.trim().toLowerCase();
  for (const a of ACTS) {
    const secs = a.sections
      .map(s => ({ ...s, screens: s.screens.filter(id => !q || id.includes(q) || (SCREENS[id]?.title || '').toLowerCase().includes(q) || s.name.toLowerCase().includes(q)) }))
      .filter(s => s.screens.length);
    if (!secs.length) continue;
    rail.appendChild(e('div', { class: 'rail-act' }, a.name));
    for (const s of secs) {
      rail.appendChild(e('div', { class: 'rail-sec' }, s.name));
      for (const id of s.screens) {
        rail.appendChild(e('button', {
          class: 'rail-link',
          'aria-current': id === current ? 'true' : 'false',
          onClick: () => go(id),
        }, e('span', null, SCREENS[id]?.title || id), e('em', null, id)));
      }
    }
  }
  if (!q) {
    const s = get();
    rail.appendChild(e('div', { class: 'rail-foot' },
      e('button', {
        class: 'stage-btn', style: { width: '100%' },
        onClick: () => {
          if (!confirm('Put the money back to the figures in the design?')) return;
          resetStore(); clearDraft(); paint();
        },
      }, 'Reset the account'),
      e('p', null, `Everyday ₦${s.everyday.toLocaleString('en-NG', { minimumFractionDigits: 2 })} · $${s.dollars.toFixed(2)} · ${s.ledger.length} entries. Anything you do here is kept in this browser and nowhere else.`)));
  }
}

function paint() {
  const m = meta(current);
  const screen = SCREENS[current];
  document.getElementById('stage-title').textContent = `${m.section} — ${screen?.title || current}`;
  document.getElementById('stage-sub').textContent = m.aim || '';

  const list = flat();
  const i = list.indexOf(current);
  document.getElementById('nav-count').textContent = `${i + 1} of ${list.length}`;
  const prev = document.getElementById('nav-prev');
  const next = document.getElementById('nav-next');
  prev.disabled = i <= 0;
  next.disabled = i >= list.length - 1;
  prev.onclick = () => go(list[i - 1]);
  next.onclick = () => go(list[i + 1]);

  const host = document.getElementById('phone-screen');
  host.classList.toggle('back', direction === 'back');
  host.innerHTML = '';
  host.appendChild(e('div', { class: 'phone-notch' }));
  try {
    host.appendChild(screen.render());
  } catch (err) {
    host.appendChild(e('div', { class: 'pad top-pad stack gap-3' },
      e('div', { class: 't-head' }, 'This screen did not draw'),
      e('div', { class: 't-meta c-3' }, String(err && err.message || err))));
    console.error(current, err);
  }
  paintRail(document.getElementById('rail-search').value);
}

function boot() {
  document.body.appendChild(
    e('div', { class: 'harness' },
      e('div', { class: 'rail' },
        e('div', { class: 'rail-brand' }, e('b', null, 'Beetle'), e('span', null, 'concept build')),
        e('input', { class: 'rail-search', id: 'rail-search', placeholder: 'Find a screen', oninput: ev => paintRail(ev.target.value) }),
        e('div', { id: 'rail-body' })),

        e('div', { class: 'stage-head' },
          e('div', null,
            e('h1', { class: 'stage-title', id: 'stage-title' }, ''),
            e('p', { class: 'stage-sub', id: 'stage-sub' }, '')),
          e('div', { class: 'stage-nav' },
            e('button', { class: 'stage-btn', id: 'nav-prev' }, '‹ Prev'),
            e('span', { class: 'stage-count', id: 'nav-count' }, ''),
            e('button', { class: 'stage-btn', id: 'nav-next' }, 'Next ›'),
            e('button', { class: 'stage-btn', id: 'agent-badge', title: 'How the agent is answering' }, 'Agent: …'))),
        e('div', { class: 'phone' }, e('div', { class: 'phone-screen', id: 'phone-screen' })))));

  window.addEventListener('hashchange', () => go(location.hash.replace('#/', ''), false));
  document.addEventListener('keydown', ev => {
    if (ev.target.tagName === 'INPUT') return;
    const list = flat(); const i = list.indexOf(current);
    if (ev.key === 'ArrowRight' && i < list.length - 1) go(list[i + 1]);
    if (ev.key === 'ArrowLeft' && i > 0) go(list[i - 1]);
  });

  go(location.hash.replace('#/', '') || flat()[0], false);

  initAgent().then(m => {
    const badge = document.getElementById('agent-badge');
    badge.textContent = { sample: 'Agent: live', key: 'Agent: live (your key)', offline: 'Agent: written answers' }[m] || 'Agent: written answers';
    badge.title = m === 'offline'
      ? 'No model reachable, so the agent answers from the wording in the design. Press to add a key and make it think.'
      : 'The agent is answering with a real model.';
    badge.onclick = () => {
      const key = prompt('Anthropic API key. It is kept in this browser only and never leaves it except to Anthropic.',
        localStorage.getItem('beetle.anthropicKey') || '');
      if (key === null) return;
      if (key.trim()) localStorage.setItem('beetle.anthropicKey', key.trim());
      else localStorage.removeItem('beetle.anthropicKey');
      location.reload();
    };
  });
}

document.addEventListener('DOMContentLoaded', boot);

return {  };
})();
