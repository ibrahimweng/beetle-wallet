name: Tests

# Every screen has to draw, and the money has to actually move. This is the
# check that matters, so it stands on its own: red here means something broke.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Every screen draws, and the money really moves
        run: npm test
      - name: The committed bundle matches the source
        run: git diff --exit-code dist/ || (echo 'dist/beetle.html is stale — run `npm run build` and commit it'; exit 1)
